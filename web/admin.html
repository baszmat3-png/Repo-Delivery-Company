<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم ريو</title><meta name="theme-color" content="#111827">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--ac:#ffd21f;--side:#111827;--red:#dc2626;--grn:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
button,input,select{font:inherit}.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
.side h1{font-size:19px;margin:4px 10px 16px;color:var(--ac)}.side button{display:block;width:100%;text-align:right;background:none;border:0;color:#cbd5e1;padding:11px 14px;border-radius:12px;margin-bottom:4px;cursor:pointer}
.side button.on{background:var(--ac);color:#111;font-weight:800}.side .out{margin-top:18px;color:#fca5a5}
.main{flex:1;min-width:0;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;font-size:22px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 4px #0001;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 4px #0001}.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px}
.kpi.g b{color:var(--grn)}.kpi.r b{color:var(--red)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:14px}th{color:var(--mut);font-weight:700}
.b{border:0;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;background:var(--ac);color:#111;text-decoration:none;display:inline-block;font-size:13px}
.b.g{background:#eef0f4}.b.w{background:#25d366;color:#fff}.b.d{background:#fee2e2;color:var(--red)}
.in{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.login{max-width:360px;margin:12vh auto;padding:20px}.login .in{width:100%;margin-bottom:10px}.err{color:var(--red);min-height:20px}
.pill{background:#eef0f4;border-radius:99px;padding:3px 10px;font-size:12px}
@media(max-width:800px){.app{display:block}.side{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}.side h1{display:none}.side button{width:auto;white-space:nowrap;margin:0}.side .out{margin:0}}
</style></head><body><div id="root"></div>
<script src="config.js"></script>
<script>
const API=String(window.RIO_API||'').replace(/\/$/,''),KEY='rio_admin_token',DAY=864e5,OFF=3*36e5;
const ST={pending:'بانتظار سائق',picking_up:'استلام من التاجر',on_the_way:'في الطريق',delivered:'تم التسليم',no_answer:'لا يرد',problem:'مشكلة',other:'أخرى',returned:'راجع',partial:'راجع جزئي',cancelled:'ملغي'};
const PAGES=[['home','الإحصائيات'],['orders','الطلبات'],['merchants','التجار'],['drivers','السائقون'],['expenses','المصاريف']];
let T=localStorage.getItem(KEY)||'',P='home',R='month',D=null,O=[],Q='',F='all',E='';
const $=(s)=>document.querySelector(s),esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n)=>Number(n||0).toLocaleString('en-US'),mny=(n)=>nf(n)+' د.ع';
const ds=(t)=>Math.floor((t+OFF)/DAY)*DAY-OFF,fd=(t)=>{const d=new Date(t+OFF);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
function range(){const n=Date.now(),s=ds(n);if(R==='today')return[s,s+DAY];if(R==='week')return[s-6*DAY,s+DAY];if(R==='month'){const d=new Date(n+OFF);return[Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)-OFF,s+DAY]}return[0,s+DAY]}
async function api(m,p,b){let r;try{r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined})}catch{throw Error('لا يوجد اتصال بالخادم')}
const j=await r.json().catch(()=>({}));if(r.status===401&&T&&p!=='/api/login'){out();throw Error(j.error||'انتهت الجلسة')}if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function out(){T='';localStorage.removeItem(KEY);draw()}
async function load(){try{const[a,b]=range();D=await api('GET','/api/admin/stats?from='+a+'&to='+b);O=(await api('GET','/api/admin/orders')).orders;E=''}catch(e){E=e.message}draw()}
const wa=(p,t)=>{let d=String(p||'').replace(/\D/g,'');if(d[0]==='0')d='964'+d.slice(1);return'https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):'')};
function pr(html){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write('<!doctype html><html dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma,sans-serif;max-width:80mm;margin:0 auto;padding:8px}h3,.c{text-align:center}.r{display:flex;justify-content:space-between;padding:4px 0}hr{border:0;border-top:1px dashed #888}.bx{border:2px solid #111;border-radius:10px;padding:8px;font-weight:bold}</style>'+html);d.close();setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),2000)},300)}
const rw=(l,v)=>'<div class="r"><b>'+esc(l)+'</b><span>'+esc(v)+'</span></div>';
function receipt(o){pr('<h3>ريو للتوصيل أسرع</h3><div class="bx c">وصل توصيل #'+o.no+'</div>'+rw('التاريخ',fd(o.createdAt))+rw('الحالة',ST[o.status]||o.status)+rw('التاجر',o.merchantName)+'<hr>'+rw('رقم الزبون',o.customerPhone)+rw('المنطقة',o.customerArea)+'<hr>'+rw('البضاعة',o.product)+rw('عدد القطع',o.qty)+'<div class="bx r"><span>المبلغ المطلوب</span><span>'+mny(o.total)+'</span></div>'+rw('أجرة التوصيل',mny(o.deliveryPrice))+rw('الصافي للتاجر',mny(o.productPrice))+'<hr>'+rw('المندوب',o.driverName||'—'))}
function stmt(u,kind){const d=kind==='m'?rw('الطلبات',u.orders)+rw('المسلّمة',u.delivered)+rw('قيمة البضائع المسلّمة',mny(u.goods))+rw('أجور التوصيل',mny(u.delivery)):rw('الطلبات المقبولة',u.orders)+rw('المسلّمة',u.delivered)+rw('رسوم التطبيق',mny(u.fees))+rw('المبالغ المحصّلة',mny(u.collected))+rw('الرصيد الحالي',mny(u.balance));pr('<h3>ريو للتوصيل أسرع</h3><div class="bx c">كشف '+(kind==='m'?'تاجر':'مندوب')+'</div>'+rw('الاسم',u.name)+rw('الهاتف',u.phone)+rw('الفترة',({today:'اليوم',week:'7 أيام',month:'هذا الشهر',all:'الكل'})[R])+'<hr>'+d)}
const kpi=(l,v,c)=>'<div class="kpi '+(c||'')+'"><small>'+l+'</small><b>'+v+'</b></div>';
function home(){const s=D,c=s.counts,mx=Math.max(1,...s.days.map((x)=>x.n));
const top=(a,k)=>[...a].sort((x,y)=>y.delivered-x.delivered).slice(0,5).map((u)=>'<tr><td>'+esc(u.name)+'</td><td>'+u.delivered+'</td><td>'+mny(k==='m'?u.goods:u.fees)+'</td></tr>').join('');
return'<div class="kpis">'+kpi('إجمالي الطلبات',nf(s.total))+kpi('المسلّمة',nf(s.delivered),'g')+kpi('بانتظار سائق',nf(c.pending||0))+kpi('مشاكل / لا يرد',nf((c.problem||0)+(c.no_answer||0)+(c.other||0)),'r')+kpi('إيرادات التطبيق (الرسوم)',mny(s.fees),'g')+kpi('المصاريف',mny(s.expenses),'r')+kpi('صافي الربح',mny(s.net),s.net<0?'r':'g')+kpi('قيمة البضائع المسلّمة',mny(s.goods))+kpi('أجور التوصيل المسلّمة',mny(s.delivery))+kpi('شحن الكروت',mny(s.cards))+kpi('أرصدة السائقين',mny(s.drivers.reduce((a,u)=>a+u.balance,0)))+'</div>'
+'<div class="card"><b>الطلبات حسب اليوم</b><div class="bars">'+s.days.slice(-14).map((x)=>'<div>'+x.n+'<i style="height:'+Math.max(3,x.n/mx*100)+'px"></i>'+fd(x.t).slice(5)+'</div>').join('')+'</div></div>'
+'<div class="card"><b>الحالات</b><div class="row" style="margin-top:8px">'+Object.keys(ST).map((k)=>'<span class="pill">'+ST[k]+': '+(c[k]||0)+'</span>').join('')+'</div></div>'
+'<div class="row" style="align-items:stretch"><div class="card tw" style="flex:1"><b>أفضل التجار</b><table style="min-width:0"><tr><th>التاجر</th><th>مسلّم</th><th>البضائع</th></tr>'+top(s.merchants,'m')+'</table></div><div class="card tw" style="flex:1"><b>أفضل السائقين</b><table style="min-width:0"><tr><th>السائق</th><th>مسلّم</th><th>الرسوم</th></tr>'+top(s.drivers,'d')+'</table></div></div>'}
function orders(){const q=Q.trim(),l=O.filter((o)=>(F==='all'||o.status===F)&&(!q||[o.no,o.merchantName,o.customerPhone,o.customerArea,o.driverName,o.product].join(' ').includes(q)));
return'<div class="card"><div class="row" style="margin-bottom:10px"><input class="in" id="q" placeholder="بحث سريع…" value="'+esc(Q)+'"><select class="in" data-a="f"><option value="all">كل الحالات</option>'+Object.keys(ST).map((k)=>'<option value="'+k+'"'+(F===k?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select><span class="pill">'+l.length+' سجل</span></div><div class="tw"><table><tr><th>الطلب</th><th>التاجر</th><th>الزبون</th><th>المنتج</th><th>الإجمالي</th><th>المندوب</th><th>الحالة</th><th>إجراءات</th></tr>'
+l.map((o)=>'<tr><td><b>#'+o.no+'</b><br><small>'+fd(o.createdAt)+'</small></td><td>'+esc(o.merchantName)+'</td><td>'+esc(o.customerArea)+'<br>'+esc(o.customerPhone)+'</td><td>'+esc(o.product)+' × '+o.qty+'</td><td>'+mny(o.total)+'</td><td>'+esc(o.driverName||'—')+'</td><td><select class="in" data-a="st" data-id="'+o.id+'">'+Object.keys(ST).map((k)=>'<option value="'+k+'"'+(o.status===k?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select></td><td class="row"><a class="b w" target="_blank" rel="noopener" href="'+wa(o.customerPhone,'بخصوص طلبك #'+o.no+' من '+o.merchantName+' — ريو للتوصيل أسرع')+'">واتساب</a><button class="b" data-a="rc" data-id="'+o.id+'">طباعة وصل</button></td></tr>').join('')+'</table></div></div>'}
function people(kind){const a=kind==='m'?D.merchants:D.drivers;
return'<div class="card tw"><table><tr><th>الاسم</th><th>الهاتف</th><th>'+(kind==='m'?'المنطقة':'المركبة')+'</th><th>الطلبات</th><th>المسلّمة</th><th>'+(kind==='m'?'قيمة البضائع':'الرسوم')+'</th>'+(kind==='d'?'<th>الرصيد</th>':'')+'<th>الحالة</th><th>إجراءات</th></tr>'
+a.map((u)=>'<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.phone)+'</td><td>'+esc(kind==='m'?u.area:(u.vehicle==='car'?'سيارة':'دراجة'))+'</td><td>'+u.orders+'</td><td>'+u.delivered+'</td><td>'+mny(kind==='m'?u.goods:u.fees)+'</td>'+(kind==='d'?'<td>'+mny(u.balance)+'</td>':'')+'<td><button class="b g" data-a="tg" data-id="'+u.id+'">'+(u.active?'فعّال':'موقوف')+'</button></td><td class="row"><a class="b w" target="_blank" rel="noopener" href="'+wa(u.phone,'مرحباً '+u.name+'، ريو للتوصيل أسرع')+'">واتساب</a><button class="b" data-a="pu" data-k="'+kind+'" data-id="'+u.id+'">طباعة كشف</button>'+(kind==='d'?'<button class="b g" data-a="adj" data-id="'+u.id+'">رصيد</button>':'')+'</td></tr>').join('')+'</table></div>'}
function expenses(){const s=D,by={};s.expensesList.forEach((e)=>{by[e.category]=(by[e.category]||0)+e.amount});
return'<div class="kpis">'+kpi('مجموع المصاريف',mny(s.expenses),'r')+kpi('إيرادات التطبيق',mny(s.fees),'g')+kpi('صافي الربح',mny(s.net),s.net<0?'r':'g')+'</div><div class="card"><b>إضافة مصروف</b><div class="row" style="margin-top:8px"><input class="in" id="ea" inputmode="numeric" placeholder="المبلغ"><input class="in" id="ec" list="cats" placeholder="النوع (رواتب، إيجار…)"><datalist id="cats"><option>رواتب<option>إيجار<option>إعلانات<option>وقود<option>صيانة<option>عام</datalist><input class="in" id="en" placeholder="ملاحظة"><input class="in" id="ed" type="date" value="'+fd(Date.now())+'"><button class="b" data-a="ea">إضافة</button></div></div>'
+'<div class="card"><b>حسب النوع</b><div class="row" style="margin-top:8px">'+Object.keys(by).map((k)=>'<span class="pill">'+esc(k)+': '+mny(by[k])+'</span>').join('')+'</div></div><div class="card tw"><table><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>'+s.expensesList.map((e)=>'<tr><td>'+fd(e.at)+'</td><td>'+esc(e.category)+'</td><td>'+mny(e.amount)+'</td><td>'+esc(e.note)+'</td><td><button class="b d" data-a="ed" data-id="'+e.id+'">حذف</button></td></tr>').join('')+'</table></div>'}
function draw(){const r=$('#root');
if(!T){r.innerHTML='<form class="card login" id="lf"><h2>لوحة تحكم ريو</h2><input class="in" name="phone" inputmode="tel" placeholder="رقم الهاتف" required><input class="in" name="password" type="password" placeholder="كلمة المرور" required><div class="err" id="le"></div><button class="b" style="width:100%;padding:11px">دخول</button></form>';return}
const view=!D?'<div class="card">'+(E?esc(E)+' <button class="b" data-a="rl">إعادة المحاولة</button>':'جارٍ التحميل…')+'</div>':({home,orders,merchants:()=>people('m'),drivers:()=>people('d'),expenses})[P]();
r.innerHTML='<div class="app"><nav class="side"><h1>ريو • الإدارة</h1>'+PAGES.map(([k,l])=>'<button data-a="p" data-k="'+k+'" class="'+(P===k?'on':'')+'">'+l+'</button>').join('')+'<button class="out" data-a="lo">تسجيل الخروج</button></nav><main class="main"><div class="top"><h2>'+PAGES.find((x)=>x[0]===P)[1]+'</h2><div class="row"><select class="in" data-a="rg">'+[['today','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['all','الكل']].map(([k,l])=>'<option value="'+k+'"'+(R===k?' selected':'')+'>'+l+'</option>').join('')+'</select><button class="b g" data-a="rl">تحديث</button></div></div>'+view+'</main></div>';
const q=$('#q');if(q){q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}}
document.addEventListener('submit',async(e)=>{if(e.target.id!=='lf')return;e.preventDefault();const f=e.target;try{const r=await api('POST','/api/login',{phone:f.phone.value,password:f.password.value});if(r.user.role!=='admin')throw Error('هذه اللوحة للمدير فقط');T=r.token;localStorage.setItem(KEY,T);load()}catch(x){$('#le').textContent=x.message}});
document.addEventListener('change',async(e)=>{const a=e.target.dataset.a;if(a==='rg'){R=e.target.value;load()}else if(a==='f'){F=e.target.value;draw()}else if(a==='st'){try{await api('POST','/api/admin/orders/'+e.target.dataset.id+'/status',{status:e.target.value});load()}catch(x){alert(x.message)}}});
document.addEventListener('click',async(e)=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;const a=el.dataset.a,id=Number(el.dataset.id);
try{if(a==='p'){P=el.dataset.k;draw()}else if(a==='lo')out();else if(a==='rl')load();
else if(a==='rc')receipt(O.find((o)=>o.id===id));
else if(a==='pu'){const k=el.dataset.k;stmt((k==='m'?D.merchants:D.drivers).find((u)=>u.id===id),k)}
else if(a==='tg'){const u=[...D.merchants,...D.drivers].find((x)=>x.id===id);await api('PUT','/api/admin/users/'+id,{active:!u.active});load()}
else if(a==='adj'){const v=prompt('اكتب المبلغ (موجب للإضافة وسالب للخصم):');if(v){await api('POST','/api/admin/users/'+id+'/adjust',{amount:v,label:'تعديل من الإدارة'});load()}}
else if(a==='ea'){const d=$('#ed').value;await api('POST','/api/admin/expenses',{amount:$('#ea').value,category:$('#ec').value,note:$('#en').value,at:d?Date.parse(d+'T12:00:00+03:00'):Date.now()});load()}
else if(a==='ed'&&confirm('حذف هذا المصروف؟')){await api('DELETE','/api/admin/expenses/'+id);load()}}catch(x){alert(x.message)}});
if(T)load();else draw();
</script></body></html>

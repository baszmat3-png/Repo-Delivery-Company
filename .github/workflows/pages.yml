name: نشر الموقع على GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: ضبط عنوان الخادم
        run: |
          if [ -z "${{ vars.RIO_API_URL }}" ]; then echo "::error::أضف متغير المستودع RIO_API_URL (رابط Render)"; exit 1; fi
          echo 'window.RIO_API = "${{ vars.RIO_API_URL }}";' > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4

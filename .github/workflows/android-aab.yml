name: بناء AAB لمتجر Play (غير موقّع)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: ضبط عنوان الخادم
        run: |
          API_URL="${{ vars.RIO_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://repo-delivery-company2.onrender.com"; fi
          echo "window.RIO_API = \"$API_URL\";" > web/config.js
      - run: npm install
      - run: npx cap add android
      - name: إشعارات الهاتف (Firebase + إذن الإشعارات)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; elif [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; else echo "::warning::GOOGLE_SERVICES_JSON_BASE64 غير مضبوط: لن تصل إشعارات الدفع للتطبيق وهو مغلق"; fi
          if [ -f android/app/google-services.json ] && ! grep -q '"package_name": *"com.rioiraq.delivery"' android/app/google-services.json; then rm android/app/google-services.json; echo "::warning::google-services.json لا يطابق com.rioiraq.delivery فتم تجاهله. أنشئ تطبيق Android جديداً في Firebase بهذا الاسم وحدّث الملف"; fi
          if [ -f android/app/google-services.json ]; then echo "window.RIO_FCM = true;" >> web/config.js; else echo "window.RIO_FCM = false;" >> web/config.js; fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' $M
          grep -q FOREGROUND_SERVICE_LOCATION $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <application#' $M
          grep -q "android.hardware.location.gps" $M || sed -i 's#<application#<uses-feature android:name="android.hardware.location" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.location.network" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.hardware.telephony" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <application#' $M
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          sed -i 's#android:required="false" />#android:required="false" tools:replace="android:required" />#g' $M
          grep -q rio_orders $M || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="rio_orders" />\n    </application>#' $M
      - name: أيقونات التطبيق
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: رقم الإصدار
        run: sed -i "s/versionCode 1/versionCode $((${{ github.run_number }} + 1000))/" android/app/build.gradle
      - name: تفعيل R8 (تصغير الكود وتعتيمه — مطلب Google Play لجودة DEX)
        run: |
          G=android/app/build.gradle
          sed -i 's/minifyEnabled false/minifyEnabled true/' $G
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" $G
          grep -q "minifyEnabled true" $G || { echo "::error::لم يُعثر على minifyEnabled في build.gradle"; exit 1; }
          P=android/app/proguard-rules.pro
          {
            echo ''
            echo '# ===== ريوو: قواعد R8 لـ Capacitor والإضافات (لا تُعتَّم لأنها تُستدعى من الواجهة بالاسم) ====='
            echo '-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions,SourceFile,LineNumberTable'
            echo '-renamesourcefileattribute SourceFile'
            echo '-keep class com.getcapacitor.** { *; }'
            echo '-keep public class * extends com.getcapacitor.Plugin { *; }'
            echo '-keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }'
            echo '-keepclassmembers class * { @com.getcapacitor.PluginMethod public <methods>; @android.webkit.JavascriptInterface <methods>; }'
            echo '-keep class com.rioiraq.delivery.** { *; }'
            echo '-keep class com.google.firebase.messaging.** { *; }'
            echo '-dontwarn com.getcapacitor.**'
            # كل حزم جافا/كوتلن الخاصة بإضافات Capacitor المثبتة (تُكتشف تلقائياً)
            for d in node_modules/@capacitor/*/android/src/main node_modules/@capgo/*/android/src/main; do
              [ -d "$d" ] || continue
              grep -rhoE '^package [A-Za-z0-9_.]+' "$d" 2>/dev/null | awk '{print $2}' | sort -u | while read -r pk; do echo "-keep class $pk.** { *; }"; echo "-dontwarn $pk.**"; done
            done
          } >> $P
          echo "---- proguard-rules.pro ----"; tail -n 40 $P
      - name: بناء AAB (غير موقّع — يُوقَّع محلياً بمفتاح الرفع الثابت)
        working-directory: android
        run: ./gradlew bundleRelease
      - name: APK تجريبي بنفس إعداد R8 (موقّع بمفتاح تجريبي للتثبيت المباشر)
        working-directory: android
        run: |
          KS="$RUNNER_TEMP/test.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Rio Test" >/dev/null 2>&1
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$KS" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=test -Pandroid.injected.signing.key.password=android
      - run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/app-unsigned.aab
          cp android/app/build/outputs/apk/release/*.apk out/rio-release-r8.apk
          ls -l out; [ -f android/app/build/outputs/mapping/release/mapping.txt ] && wc -l android/app/build/outputs/mapping/release/mapping.txt || echo "no mapping"
          unzip -l out/app-unsigned.aab | grep -i "proguard.map\|obfuscation" || echo "mapping not bundled" 
      - name: نشر الملفات على فرع مؤقت
        run: |
          mkdir pub && cp out/app-unsigned.aab out/rio-release-r8.apk pub/
          cd pub && git init -q -b aab-output
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "aab build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aab-output

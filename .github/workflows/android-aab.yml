name: بناء AAB لمتجر Play (غير موقّع)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: ضبط عنوان الخادم
        run: |
          API_URL="${{ vars.RIO_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://repo-delivery-company2.onrender.com"; fi
          echo "window.RIO_API = \"$API_URL\";" > web/config.js
      - run: npm install
      - run: npx cap add android
      - name: إشعارات الهاتف (Firebase + إذن الإشعارات)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; elif [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; else echo "::warning::GOOGLE_SERVICES_JSON_BASE64 غير مضبوط: لن تصل إشعارات الدفع للتطبيق وهو مغلق"; fi
          if [ -f android/app/google-services.json ] && ! grep -q '"package_name": *"com.rioiraq.delivery"' android/app/google-services.json; then rm android/app/google-services.json; echo "::warning::google-services.json لا يطابق com.rioiraq.delivery فتم تجاهله. أنشئ تطبيق Android جديداً في Firebase بهذا الاسم وحدّث الملف"; fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q rio_orders $M || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="rio_orders" />\n    </application>#' $M
      - name: أيقونات التطبيق
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: رقم الإصدار
        run: sed -i "s/versionCode 1/versionCode $((${{ github.run_number }} + 100))/" android/app/build.gradle
      - name: بناء AAB (غير موقّع — يُوقَّع محلياً بمفتاح الرفع الثابت)
        working-directory: android
        run: ./gradlew bundleRelease
      - run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/app-unsigned.aab
      - name: نشر الملفات على فرع مؤقت
        run: |
          mkdir pub && cp out/app-unsigned.aab pub/
          cd pub && git init -q -b aab-output
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "aab build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aab-output

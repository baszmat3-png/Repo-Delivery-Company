name: بناء AAB لمتجر Play (غير موقّع)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: ضبط عنوان الخادم
        run: |
          API_URL="${{ vars.RIO_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://repo-delivery-company2.onrender.com"; fi
          echo "window.RIO_API = \"$API_URL\";" > web/config.js
      - run: npm install
      - run: npx cap add android
      - name: أيقونات التطبيق
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: رقم الإصدار
        run: sed -i "s/versionCode 1/versionCode $((${{ github.run_number }} + 100))/" android/app/build.gradle
      - name: بناء AAB (غير موقّع — يُوقَّع محلياً بمفتاح الرفع الثابت)
        working-directory: android
        run: ./gradlew bundleRelease
      - run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/app-unsigned.aab
      - name: نشر الملفات على فرع مؤقت
        run: |
          mkdir pub && cp out/app-unsigned.aab pub/
          cd pub && git init -q -b aab-output
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "aab build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aab-output

name: بناء تطبيق أندرويد
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: ضبط عنوان الخادم
        run: |
          API_URL="${{ vars.RIO_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://repo-delivery-company2.onrender.com"; fi
          echo "window.RIO_API = \"$API_URL\";" > web/config.js
      - run: npm install
      - run: npx cap add android
      - name: إشعارات الهاتف (Firebase + إذن الإشعارات)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" | base64 -d > android/app/google-services.json; elif [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; else echo "::warning::GOOGLE_SERVICES_JSON_BASE64 غير مضبوط: لن تصل إشعارات الدفع للتطبيق وهو مغلق"; fi
          if [ -f android/app/google-services.json ] && ! grep -q '"package_name": *"com.rioiraq.delivery"' android/app/google-services.json; then rm android/app/google-services.json; echo "::warning::google-services.json لا يطابق com.rioiraq.delivery فتم تجاهله. أنشئ تطبيق Android جديداً في Firebase بهذا الاسم وحدّث الملف"; fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q rio_orders $M || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="rio_orders" />\n    </application>#' $M
      - name: أيقونات التطبيق
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: رقم الإصدار
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: بناء APK للتجربة
        working-directory: android
        run: ./gradlew assembleDebug
      - name: بناء AAB موقّع لمتجر Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"
      - uses: actions/upload-artifact@v4
        with:
          name: rio-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: نشر APK على فرع مؤقت
        run: |
          mkdir pub && cp android/app/build/outputs/apk/debug/*.apk pub/rio.apk
          cd pub && git init -q -b apk-output
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "apk build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-output

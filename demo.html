<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ريو للتوصيل أسرع - نسخة تجريبية</title>
<meta name="theme-color" content="#0b1119">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>/* Layout: sticky topbar; side rail (>=900px) or bottom tabs (mobile); content column 760px, admin 1100px. */
:root{
  --bg:#0b1119; --surface:#111b27; --surface-2:#172431; --input:#0a1017; --line:#223244;
  --fg:#eef2f6; --muted:#8c9db0; --accent:#ffd21f; --accent-ink:#171200; --accent-text:#ffd21f; --accent-soft:rgba(255,210,31,.13);
  --amber:#f0a93c; --green:#4cc884; --red:#f2766d; --blue:#7499f2;
  --amber-soft:rgba(240,169,60,.14); --green-soft:rgba(76,200,132,.14); --red-soft:rgba(242,118,109,.14); --blue-soft:rgba(116,153,242,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --input:#f2f5f8; --line:#dbe3ea;
  --fg:#111a24; --muted:#5b6c7e; --accent:#ffd21f; --accent-ink:#171200; --accent-text:#7d5f00; --accent-soft:rgba(255,210,31,.3);
  --amber:#a4660a; --green:#1d7f4a; --red:#c4372e; --blue:#2f55c4;
  --amber-soft:rgba(240,169,60,.2); --green-soft:rgba(76,200,132,.2); --red-soft:rgba(242,118,109,.2); --blue-soft:rgba(116,153,242,.2);
  --shadow:0 10px 30px rgba(17,26,36,.12); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --input:#f2f5f8; --line:#dbe3ea;
  --fg:#111a24; --muted:#5b6c7e; --accent:#ffd21f; --accent-ink:#171200; --accent-text:#7d5f00; --accent-soft:rgba(255,210,31,.3);
  --amber:#a4660a; --green:#1d7f4a; --red:#c4372e; --blue:#2f55c4;
  --amber-soft:rgba(240,169,60,.2); --green-soft:rgba(76,200,132,.2); --red-soft:rgba(242,118,109,.2); --blue-soft:rgba(116,153,242,.2);
  --shadow:0 10px 30px rgba(17,26,36,.12); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.04em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* logo */
.logo{display:inline-flex;align-items:center;gap:8px;direction:rtl;line-height:1}
.logo-lines{width:26px;height:20px;flex:none}
.logo-lines i{display:block;height:3.5px;border-radius:2px;background:var(--accent);margin-block:3px 0}
.logo-lines i:nth-child(1){width:26px}.logo-lines i:nth-child(2){width:19px}.logo-lines i:nth-child(3){width:23px}
.logo-word{font-family:var(--font-display);font-weight:900;font-size:30px;font-style:italic;display:block}
.logo-sub{font-size:9.5px;font-weight:600;letter-spacing:.02em;display:block;opacity:.75;margin-top:2px;text-align:center}
.logo-col{display:flex;flex-direction:column;transform:skewX(-6deg)}
.logo.big .logo-word{font-size:76px}.logo.big .logo-sub{font-size:19px}.logo.big .logo-lines{width:80px;height:62px}
.logo.big .logo-lines i{height:9px;margin-block:8px 0}
.logo.big .logo-lines i:nth-child(1){width:80px}.logo.big .logo-lines i:nth-child(2){width:58px}.logo.big .logo-lines i:nth-child(3){width:70px}
.logo.dark .logo-lines i{background:var(--accent-ink)}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;border-bottom:1px solid transparent;max-width:1180px;margin:0 auto}
.topbar .grp{display:flex;align-items:center;gap:14px;min-width:0}
.rolechip{display:inline-flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:9px 14px;font-weight:600}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;padding:6px 2px}
.modepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.modepill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.modepill.live i{background:var(--green)}
.shell{max-width:1180px;margin:0 auto;display:block}
.shell.wide{max-width:1180px}
.main{min-width:0;padding-block:8px 120px}
.col{max-width:760px;margin:0 auto}
.col.wide{max-width:1100px}
.nav{position:fixed;inset:auto 0 0 0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:4px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;background:none;border:0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:500;color:var(--muted);position:relative}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:19px;height:19px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
  .nav{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));inset:auto;flex-direction:column;justify-content:flex-start;background:transparent;border:0;padding:8px 0}
  .nav button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px;justify-content:flex-start}
  .badge{position:static;margin-inline-start:auto}
  .main{padding-block:8px 60px}
}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:10px 16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:800}
.ph .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec{font-size:13px;color:var(--muted);font-weight:600;margin:20px 4px 8px}
.rule{height:1px;background:var(--line);border:0;margin:12px 0}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:11px 18px;font-weight:700;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:44;box-shadow:var(--shadow);border-radius:99px;padding:14px 22px}
@media (min-width:900px){.fab{bottom:28px}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:600}
.in{width:100%;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.in{min-height:78px;resize:vertical}
select.in{appearance:none;background-image:none;padding-inline-end:12px}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--input);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;background:none;border:0;border-radius:12px;padding:10px 8px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;line-height:1.3}
.seg button small{font-weight:500;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.row-seg button{flex-direction:row}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--input);border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.toggle{width:56px;height:32px;border-radius:99px;border:2px solid var(--line);background:var(--input);position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{background:var(--accent-ink);transform:translateX(-24px)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
button.pill{cursor:pointer;min-height:36px}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:30;min-width:230px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:start;padding:11px 12px;border-radius:12px;font-size:15px}
.menu button:hover{background:var(--accent-soft)}
.menu .ck{width:18px;display:inline-grid;place-items:center;color:var(--accent-text)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:132px;color:inherit}
.tile .ring{width:62px;height:62px;border-radius:50%;border:4px solid var(--c,var(--accent));display:grid;place-items:center;font-size:20px;font-weight:700}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.tile b{font-weight:600;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px}
.kpi strong{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:2px}

/* order cards */
.ord{display:flex;flex-direction:column;gap:12px}
.ord-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ord-no{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}
.notice{background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:500}
.notice.red{background:var(--red-soft);color:var(--red)}
.phone{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-family:var(--font-mono)}
.avail{display:flex;gap:14px;align-items:stretch}
.avail .info{flex:1;min-width:0}
.avail .act{display:flex;flex-direction:column;gap:8px;width:128px;flex:none}
.avail h3{font-size:19px}
.price-line{font-weight:700;font-size:16px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:20px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.steps{display:flex;gap:4px;margin-top:2px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* wallet */
.balance{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.balance strong{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1.1;display:block}
.balance .ico{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.period{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.period>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.period small{color:var(--muted);font-size:13px;display:block}
.period b{font-family:var(--font-display);font-size:28px;display:block;line-height:1.2;margin-top:2px}
.period hr{border:0;height:1px;background:var(--line);margin:8px 0}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:14px;padding:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.neg{color:var(--red);font-weight:700}.pos{color:var(--green);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:22px}
.bars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .b{width:100%;max-width:44px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:3px}
.bars span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bars em{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

/* profile */
.avatar{width:104px;height:104px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:48px;font-weight:800;margin:6px auto 10px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.list-item .grow b{display:block;font-size:16px}
.list-item .grow small{color:var(--muted);font-size:13.5px}
.list-item .chev{color:var(--muted)}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* landing */
.land{max-width:1040px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;display:grid;gap:22px;position:relative;z-index:1}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:44px 20px;display:grid;place-items:center;overflow:hidden}
.hero .logo{transform:none}
.land h1{font-size:clamp(30px,5vw,44px);font-weight:900}
.land .lead{color:var(--muted);font-size:17px;margin-top:10px;max-width:46ch}
.roles{display:grid;gap:12px}
.role{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:start;width:100%;transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--accent)}
.role:disabled{opacity:.5;cursor:wait}
.role .ico{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.role .ico svg{width:28px;height:28px}
.role b{display:block;font-family:var(--font-display);font-size:21px}
.role small{color:var(--muted);font-size:14.5px}
@media (min-width:860px){.land{grid-template-columns:1.05fr 1fr;align-items:center;gap:36px;padding-block:48px}.hero{padding:70px 24px}.land .intro{grid-column:1/-1;text-align:center}.land .lead{margin-inline:auto}}
.land .fine{font-size:13px;color:var(--muted);text-align:center}

/* sheet / toast */
#sheet-root[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(3,8,14,.62);z-index:70}
.sheet{position:fixed;z-index:71;inset:auto 0 0 0;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(560px,94vw);border-radius:26px;animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h2{font-size:21px;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;background:var(--input);border:1px solid var(--line);display:grid;place-items:center}
.card-viz{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;min-height:170px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.card-viz::before{content:"";position:absolute;inset:-30% auto -30% 8%;width:46px;background:rgba(23,18,0,.55);transform:rotate(22deg)}
.card-viz .no{font-family:var(--font-mono);font-weight:500;font-size:clamp(20px,6vw,28px);letter-spacing:.08em;direction:ltr;text-align:center;position:relative}
.card-viz .logo{position:relative}
.chat{display:flex;flex-direction:column;gap:8px;height:min(46dvh,380px);overflow:auto;padding:4px;margin-bottom:12px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--surface-2);align-self:flex-start;font-size:14.5px;overflow-wrap:anywhere}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg small{display:block;opacity:.7;font-size:11.5px;margin-bottom:1px}
#toast-root{position:fixed;z-index:90;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:var(--shadow);max-width:92vw;animation:up .2s ease-out}
.toast.err{background:var(--red);color:#fff}

<body>
<div id="app" aria-live="polite"></div>
<div id="sheet-root" hidden></div>
<div id="toast-root" role="status"></div>
<script>/* خادم وهمي داخل المتصفح: يحاكي واجهة API كاملة ببيانات تجريبية في الذاكرة */
(() => {
const MIN = 60000, HR = 3600000, DAY = 86400000, OFF = 3 * HR;
const T = () => Date.now();
const nd = (s) => String(s ?? '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const phoneOf = (s) => nd(s).replace(/\D/g, '');
const intOf = (v) => Math.round(Number(nd(v).replace(/[,\s]/g, '')));
const normArea = (s) => nd(s).trim().replace(/\s+/g, ' ').replace(/^ال/, '');
const dayStart = (t) => Math.floor((t + OFF) / DAY) * DAY - OFF;
const weekStart = (t) => dayStart(t) - ((new Date(dayStart(t) + OFF).getUTCDay() + 1) % 7) * DAY;
const monthStart = (t) => { const d = new Date(t + OFF); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - OFF; };
class E extends Error { constructor(s, m) { super(m); this.status = s; } }
const bad = (m, s = 400) => { throw new E(s, m); };

const DB = { settings: { bikeSame: 3000, bikeOther: 5000, carSame: 5000, carOther: 8000, feeSame: 500, feeOther: 1000, support: '' }, users: [], orders: [], cards: [], txs: [], msgs: [], id: 20 };
const nid = () => ++DB.id;
function user(id, role, name, phone, pw, area, vehicle, balance) { DB.users.push({ id, role, name, phone, pw, active: true, area, vehicle, balance, receiving: true, createdAt: T() - 5 * DAY }); }
user(1, 'admin', 'مدير النظام', '07700000000', 'admin1234', '', 'bike', 0);
user(2, 'merchant', 'متجر الرافدين', '07700000201', '123456', 'الكرادة', 'bike', 0);
user(3, 'merchant', 'بيت الأناقة', '07700000202', '123456', 'المنصور', 'bike', 0);
user(4, 'merchant', 'سوق الكرخ', '07700000203', '123456', 'الكرخ', 'bike', 0);
user(5, 'driver', 'علي كريم', '07700000301', '123456', '', 'bike', 5000);
user(6, 'driver', 'حسن جاسم', '07700000302', '123456', '', 'car', 12000);
const U = (id) => DB.users.find((u) => u.id === id);
const pub = (u) => ({ id: u.id, role: u.role, name: u.name, phone: u.phone, active: u.active, area: u.area, vehicle: u.vehicle, balance: u.balance, receiving: u.receiving, createdAt: u.createdAt });

const PRICE = { bike: { same: 3000, other: 5000 }, car: { same: 5000, other: 8000 } };
let no = 1033;
function seedOrder(m, area, phone, product, qty, vehicle, prod, status, driver, createdAgo, doneAgo, note) {
  const same = normArea(m.area) === normArea(area), dp = PRICE[vehicle][same ? 'same' : 'other'], c = T() - createdAgo;
  const fee = driver ? (same ? 500 : 1000) : 0;
  const o = { id: nid(), no: ++no, merchantId: m.id, merchantName: m.name, merchantArea: m.area, merchantPhone: m.phone, customerArea: area, customerPhone: phone, product, qty, vehicle, sameArea: same, note: note || '', productPrice: prod, deliveryPrice: dp, total: prod + dp, status, driverId: driver ? driver.id : null, driverName: driver ? driver.name : '', fee, createdAt: c, updatedAt: c, acceptedAt: null, deliveredAt: null, log: [{ s: 'pending', at: c }] };
  if (driver) { o.acceptedAt = c + 4 * MIN; o.updatedAt = o.acceptedAt; o.log.push({ s: 'picking_up', at: o.acceptedAt }); DB.txs.push({ id: nid(), driverId: driver.id, amount: -fee, kind: 'fee', label: 'رسوم التطبيق', orderNo: o.no, at: o.acceptedAt }); }
  if (doneAgo != null) { o.updatedAt = T() - doneAgo; if (status === 'delivered' || status === 'partial') o.deliveredAt = o.updatedAt; o.log.push({ s: status, at: o.updatedAt }); }
  DB.orders.push(o);
}
const [, , R, A, K, ali, hasan] = [0, 0, U(2), U(3), U(4), U(5), U(6)];
seedOrder(R, 'المنصور', '07700000113', 'ملابس', 5, 'bike', 70000, 'partial', hasan, 3 * DAY, 3 * DAY - 2 * HR);
seedOrder(R, 'الكرادة', '07700000112', 'إلكترونيات', 1, 'bike', 55000, 'returned', hasan, 2 * DAY + 2 * HR, 2 * DAY + HR);
seedOrder(R, 'الجامعة', '07700000111', 'أغذية', 2, 'bike', 9000, 'other', hasan, 2 * DAY, 2 * DAY - HR);
seedOrder(R, 'الشعلة', '07700000110', 'ملابس', 3, 'bike', 40000, 'problem', hasan, DAY + 5 * HR, DAY + 4 * HR);
seedOrder(R, 'الدورة', '07700000109', 'أحذية', 1, 'bike', 32000, 'no_answer', hasan, DAY + 3 * HR, DAY + 2 * HR);
seedOrder(R, 'المنصور', '07700000108', 'إكسسوارات', 4, 'bike', 16000, 'delivered', ali, 170 * MIN, 140 * MIN);
seedOrder(R, 'الكرادة', '07700000107', 'أغذية', 1, 'bike', 12000, 'delivered', ali, 150 * MIN, 100 * MIN);
seedOrder(R, 'الشعلة', '07700000106', 'ملابس', 2, 'bike', 25000, 'delivered', ali, 130 * MIN, 70 * MIN);
seedOrder(R, 'الكرادة', '07700000105', 'عطور', 1, 'bike', 18000, 'delivered', ali, 100 * MIN, 35 * MIN);
seedOrder(R, 'الجامعة', '07700000104', 'أغذية', 3, 'bike', 21000, 'on_the_way', ali, 55 * MIN, null);
seedOrder(K, 'الأعظمية', '07700000103', 'أجهزة منزلية', 1, 'bike', 60000, 'pending', null, 22 * MIN, null, 'يحتاج سلة كبيرة');
seedOrder(A, 'المنصور', '07700000102', 'أدوات منزلية', 1, 'bike', 45000, 'pending', null, 14 * MIN, null);
seedOrder(R, 'الشعلة', '07700000101', 'ملابس', 2, 'bike', 30000, 'pending', null, 6 * MIN, null);
seedOrder(R, 'المنصور', '07772223366', 'إلكترونيات', 1, 'bike', 5000, 'pending', null, 1 * MIN, null, 'اتصل قبل الوصول');
[['482915307261', 5000], ['715340928846', 10000], ['239061547730', 10000], ['908273416652', 25000], ['560147298034', 25000], ['371825960417', 50000]].forEach(([n, a]) => DB.cards.push({ number: n, amount: a, used: false, usedBy: '', usedAt: null, createdAt: T() - 2 * DAY }));
DB.cards.push({ number: '120458736921', amount: 5000, used: true, usedBy: 'علي كريم', usedAt: T() - 3 * HR, createdAt: T() - 2 * DAY });
DB.txs.push({ id: nid(), driverId: 5, amount: 5000, kind: 'charge', label: 'شحن بطاقة', orderNo: null, at: T() - 3 * HR });

const O = (id) => DB.orders.find((o) => o.id === Number(id)) || bad('الطلب غير موجود', 404);
const clone = (x) => JSON.parse(JSON.stringify(x));
const setStatus = (o, s) => { const t = T(); o.status = s; o.updatedAt = t; o.deliveredAt = ['delivered', 'partial'].includes(s) ? (o.deliveredAt || t) : null; o.log.push({ s, at: t }); };
const STATUSES = ['pending', 'picking_up', 'on_the_way', 'delivered', 'no_answer', 'problem', 'other', 'returned', 'partial', 'cancelled'];
const DRV = STATUSES.filter((s) => !['pending', 'cancelled'].includes(s));

function wallet(u) {
  const now = T();
  const done = DB.orders.filter((o) => o.driverId === u.id && ['delivered', 'partial'].includes(o.status));
  const agg = (from, to = Infinity) => { const r = done.filter((o) => o.deliveredAt >= from && o.deliveredAt < to); return { n: r.length, net: r.reduce((a, o) => a + o.deliveryPrice - o.fee, 0) }; };
  const td = dayStart(now), days = [];
  for (let i = 6; i >= 0; i--) days.push({ t: td - i * DAY, ...agg(td - i * DAY, td - i * DAY + DAY) });
  return { balance: u.balance, today: agg(td), week: agg(weekStart(now)), month: agg(monthStart(now)), days, txs: DB.txs.filter((t) => t.driverId === u.id).sort((a, b) => b.at - a.at).slice(0, 60) };
}

const R_ = [];
const route = (m, p, opts, h) => { if (typeof opts === 'function') { h = opts; opts = {}; } R_.push({ m, re: new RegExp('^' + p.replace(/:(\w+)/g, '([^/]+)') + '/?$'), opts, h }); };
const ME = { roles: ['merchant'] }, DR = { roles: ['driver'] }, AD = { roles: ['admin'] };

route('POST', '/api/login', { pub: true }, (c) => {
  const u = DB.users.find((x) => x.phone === phoneOf(c.b.phone));
  if (!u || u.pw !== String(c.b.password || '')) bad('رقم الهاتف أو كلمة المرور غير صحيحة', 401);
  if (!u.active) bad('هذا الحساب موقوف، تواصل مع الإدارة', 403);
  return { token: 'demo-' + u.id, user: pub(u) };
});
route('POST', '/api/delete-account', { pub: true }, (c) => { const u = DB.users.find((x) => x.phone === phoneOf(c.b.phone)); if (!u || u.pw !== c.b.password) bad('بيانات غير صحيحة', 401); u.active = false; return { ok: true }; });
route('GET', '/api/settings', (c) => ({ settings: DB.settings }));
route('GET', '/api/me', (c) => ({ user: pub(c.u) }));
route('PUT', '/api/me/profile', (c) => { if (String(c.b.name || '').trim().length < 2) bad('اكتب الاسم'); c.u.name = c.b.name.trim(); if (c.u.role === 'driver' && ['bike', 'car'].includes(c.b.vehicle)) c.u.vehicle = c.b.vehicle; return { user: pub(c.u) }; });
route('PUT', '/api/me/password', (c) => { if (c.u.pw !== c.b.current) bad('كلمة المرور الحالية غير صحيحة', 403); if (String(c.b.next || '').length < 6) bad('كلمة المرور الجديدة يجب ألا تقل عن 6 أحرف'); c.u.pw = c.b.next; return { ok: true }; });
route('POST', '/api/me/delete', (c) => { if (c.u.role === 'admin') bad('لا يمكن حذف حساب المدير من هنا', 403); if (c.u.pw !== c.b.password) bad('كلمة المرور غير صحيحة', 403); c.u.active = false; return { ok: true }; });
route('GET', '/api/orders/:id/messages', (c) => ({ messages: DB.msgs.filter((m) => m.orderId === Number(c.p[0])).map(({ orderId, ...m }) => m) }));
route('POST', '/api/orders/:id/messages', (c) => { const t = String(c.b.text || '').trim(); if (!t) bad('اكتب رسالة'); const m = { id: nid(), orderId: Number(c.p[0]), userId: c.u.id, role: c.u.role, name: c.u.name, text: t.slice(0, 500), at: T() }; DB.msgs.push(m); return { message: m }; });

route('GET', '/api/merchant/home', ME, (c) => ({ me: pub(c.u), settings: DB.settings, orders: clone(DB.orders.filter((o) => o.merchantId === c.u.id).sort((a, b) => b.createdAt - a.createdAt)) }));
route('POST', '/api/merchant/orders', ME, (c) => {
  const b = c.b, area = String(b.customerArea || '').trim(), ph = phoneOf(b.customerPhone), prod = String(b.product || '').trim(), price = intOf(b.productPrice);
  if (!area) bad('اكتب منطقة الزبون'); if (!/^07\d{9}$/.test(ph)) bad('رقم الزبون يجب أن يبدأ بـ 07 ويتكوّن من 11 رقماً'); if (!prod) bad('اكتب نوع المنتج');
  if (!(price > 0)) bad('اكتب سعر المنتج');
  const veh = b.vehicle === 'car' ? 'car' : 'bike', same = b.zone ? b.zone === 'same' : normArea(area) === normArea(c.u.area);
  const dp = DB.settings[veh + (same ? 'Same' : 'Other')], t = T();
  const o = { id: nid(), no: ++no, merchantId: c.u.id, merchantName: c.u.name, merchantArea: c.u.area, merchantPhone: c.u.phone, customerArea: area, customerPhone: ph, product: prod, qty: Math.min(99, Math.max(1, intOf(b.qty) || 1)), vehicle: veh, sameArea: same, note: String(b.note || '').slice(0, 200), productPrice: price, deliveryPrice: dp, total: price + dp, status: 'pending', driverId: null, driverName: '', fee: 0, createdAt: t, updatedAt: t, acceptedAt: null, deliveredAt: null, log: [{ s: 'pending', at: t }] };
  DB.orders.push(o); return { order: clone(o) };
});
route('POST', '/api/merchant/orders/:id/cancel', ME, (c) => { const o = O(c.p[0]); if (o.merchantId !== c.u.id) bad('الطلب غير موجود', 404); if (o.status !== 'pending') bad('لا يمكن إلغاء الطلب بعد قبول السائق له', 409); setStatus(o, 'cancelled'); return { order: clone(o) }; });

route('GET', '/api/driver/home', DR, (c) => ({ me: pub(c.u), settings: DB.settings, available: clone(DB.orders.filter((o) => o.status === 'pending').sort((a, b) => b.createdAt - a.createdAt)), orders: clone(DB.orders.filter((o) => o.driverId === c.u.id).sort((a, b) => b.updatedAt - a.updatedAt)), wallet: wallet(c.u) }));
route('PUT', '/api/driver/receiving', DR, (c) => { c.u.receiving = !!c.b.receiving; return { user: pub(c.u) }; });
route('POST', '/api/driver/orders/:id/accept', DR, (c) => {
  if (!c.u.receiving) bad('فعّل استقبال الطلبات أولاً', 409);
  const o = O(c.p[0]); if (o.status !== 'pending') bad('الطلب لم يعد متاحاً', 409);
  const fee = o.sameArea ? DB.settings.feeSame : DB.settings.feeOther;
  if (c.u.balance < fee) bad('رصيدك لا يكفي لرسوم التطبيق. اشحن المحفظة أولاً', 402);
  c.u.balance -= fee; o.driverId = c.u.id; o.driverName = c.u.name; o.fee = fee; o.acceptedAt = T(); setStatus(o, 'picking_up');
  DB.txs.push({ id: nid(), driverId: c.u.id, amount: -fee, kind: 'fee', label: 'رسوم التطبيق', orderNo: o.no, at: T() });
  return { order: clone(o) };
});
route('POST', '/api/driver/orders/:id/status', DR, (c) => { if (!DRV.includes(c.b.status)) bad('حالة غير صحيحة'); const o = O(c.p[0]); if (o.driverId !== c.u.id) bad('الطلب غير موجود', 404); setStatus(o, c.b.status); return { order: clone(o) }; });
route('POST', '/api/driver/charge', DR, (c) => {
  const n = nd(c.b.number).replace(/\D/g, ''); if (n.length !== 12) bad('رقم البطاقة يتكوّن من 12 رقماً');
  const k = DB.cards.find((x) => x.number === n); if (!k) bad('رقم البطاقة غير صحيح', 404); if (k.used) bad('هذه البطاقة مستخدمة مسبقاً', 409);
  k.used = true; k.usedBy = c.u.name; k.usedAt = T(); c.u.balance += k.amount; DB.txs.push({ id: nid(), driverId: c.u.id, amount: k.amount, kind: 'charge', label: 'شحن بطاقة', orderNo: null, at: T() });
  return { amount: k.amount, balance: c.u.balance };
});

route('GET', '/api/admin/overview', AD, () => {
  const td = dayStart(T()), os = DB.orders, cnt = (f) => os.filter(f).length, drv = DB.users.filter((u) => u.role === 'driver' && u.active);
  const days = []; for (let i = 6; i >= 0; i--) { const f = td - i * DAY; days.push({ t: f, n: cnt((o) => o.createdAt >= f && o.createdAt < f + DAY) }); }
  const att = os.filter((o) => (o.status === 'pending' && o.createdAt < T() - 10 * MIN) || ['no_answer', 'problem', 'other'].includes(o.status)).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 12);
  return { ordersToday: cnt((o) => o.createdAt >= td), active: cnt((o) => ['picking_up', 'on_the_way'].includes(o.status)), pending: cnt((o) => o.status === 'pending'), deliveredToday: cnt((o) => ['delivered', 'partial'].includes(o.status) && o.deliveredAt >= td), problemsToday: cnt((o) => ['no_answer', 'problem', 'other'].includes(o.status) && o.updatedAt >= td), feesToday: os.filter((o) => o.acceptedAt >= td).reduce((a, o) => a + o.fee, 0), drivers: drv.length, driverBalances: drv.reduce((a, u) => a + u.balance, 0), merchants: DB.users.filter((u) => u.role === 'merchant' && u.active).length, days, attention: clone(att) };
});
route('GET', '/api/admin/orders', AD, (c) => ({ orders: clone(DB.orders.filter((o) => !STATUSES.includes(c.q.status) || o.status === c.q.status).sort((a, b) => b.createdAt - a.createdAt)) }));
route('POST', '/api/admin/orders/:id/status', AD, (c) => { if (!STATUSES.includes(c.b.status)) bad('حالة غير صحيحة'); const o = O(c.p[0]); setStatus(o, c.b.status); return { order: clone(o) }; });
route('POST', '/api/admin/orders/:id/requeue', AD, (c) => {
  const o = O(c.p[0]); if (o.status === 'pending' || !o.driverId) bad('الطلب غير مسند لسائق', 409);
  const d = U(o.driverId); if (o.fee > 0 && d) { d.balance += o.fee; DB.txs.push({ id: nid(), driverId: d.id, amount: o.fee, kind: 'refund', label: 'استرجاع رسوم التطبيق', orderNo: o.no, at: T() }); }
  o.driverId = null; o.driverName = ''; o.fee = 0; o.acceptedAt = null; setStatus(o, 'pending'); return { order: clone(o) };
});
route('GET', '/api/admin/users', AD, (c) => ({ users: DB.users.filter((u) => u.role === (c.q.role === 'merchant' ? 'merchant' : 'driver')).map(pub).reverse() }));
route('POST', '/api/admin/users', AD, (c) => {
  const b = c.b, role = b.role === 'merchant' ? 'merchant' : 'driver', ph = phoneOf(b.phone);
  if (String(b.name || '').trim().length < 2) bad('اكتب الاسم'); if (!/^07\d{9}$/.test(ph)) bad('رقم الهاتف يجب أن يبدأ بـ 07 ويتكوّن من 11 رقماً'); if (String(b.password || '').length < 6) bad('كلمة المرور لا تقل عن 6 أحرف');
  if (role === 'merchant' && !String(b.area || '').trim()) bad('اكتب منطقة المتجر'); if (DB.users.some((u) => u.phone === ph)) bad('رقم الهاتف مسجّل مسبقاً', 409);
  user(nid(), role, b.name.trim(), ph, b.password, String(b.area || '').trim(), b.vehicle === 'car' ? 'car' : 'bike', 0); return { user: pub(DB.users[DB.users.length - 1]) };
});
route('PUT', '/api/admin/users/:id', AD, (c) => {
  const u = U(Number(c.p[0])); if (!u || u.role === 'admin') bad('المستخدم غير موجود', 404); const b = c.b;
  if (b.phone !== undefined) { const ph = phoneOf(b.phone); if (!/^07\d{9}$/.test(ph)) bad('رقم الهاتف غير صحيح'); if (DB.users.some((x) => x.phone === ph && x.id !== u.id)) bad('رقم الهاتف مسجّل مسبقاً', 409); u.phone = ph; }
  if (b.name !== undefined) { if (String(b.name).trim().length < 2) bad('اكتب الاسم'); u.name = String(b.name).trim(); }
  if (b.area !== undefined) u.area = String(b.area).trim(); if (b.vehicle !== undefined) u.vehicle = b.vehicle === 'car' ? 'car' : 'bike';
  if (b.active !== undefined) u.active = !!b.active; if (b.password) { if (String(b.password).length < 6) bad('كلمة المرور لا تقل عن 6 أحرف'); u.pw = String(b.password); }
  return { user: pub(u) };
});
route('POST', '/api/admin/users/:id/adjust', AD, (c) => {
  const u = U(Number(c.p[0])), a = intOf(c.b.amount); if (!u || u.role !== 'driver' || !a) bad('اكتب مبلغاً صحيحاً');
  if (u.balance + a < 0) bad('تعذّر تعديل الرصيد (تأكد من السائق ومن أن الرصيد يكفي)', 409);
  u.balance += a; DB.txs.push({ id: nid(), driverId: u.id, amount: a, kind: 'admin', label: String(c.b.label || '').trim() || 'تعديل من الإدارة', orderNo: null, at: T() }); return { user: pub(u) };
});
route('GET', '/api/admin/cards', AD, () => ({ cards: clone([...DB.cards].sort((a, b) => b.createdAt - a.createdAt)) }));
route('POST', '/api/admin/cards', AD, (c) => {
  const a = intOf(c.b.amount), n = Math.min(50, Math.max(1, intOf(c.b.count) || 1)); if (!(a >= 1000)) bad('اختر قيمة صحيحة للبطاقة');
  const made = []; for (let i = 0; i < n; i++) { let num; do { num = String(Math.floor(Math.random() * 1e12)).padStart(12, '0'); } while (DB.cards.some((k) => k.number === num)); DB.cards.push({ number: num, amount: a, used: false, usedBy: '', usedAt: null, createdAt: T() + i }); made.push(num); }
  return { made };
});
route('DELETE', '/api/admin/cards/:n', AD, (c) => { const i = DB.cards.findIndex((k) => k.number === c.p[0] && !k.used); if (i < 0) bad('لا يمكن حذف بطاقة مستخدمة', 409); DB.cards.splice(i, 1); return { ok: true }; });
route('PUT', '/api/admin/settings', AD, (c) => {
  for (const k of ['bikeSame', 'bikeOther', 'carSame', 'carOther', 'feeSame', 'feeOther']) if (c.b[k] !== undefined) { const v = intOf(c.b[k]); if (!(v >= 0)) bad('قيمة غير صحيحة'); DB.settings[k] = v; }
  if (c.b.support !== undefined) DB.settings.support = phoneOf(c.b.support).slice(0, 15); return { settings: DB.settings };
});

const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts = {}) => {
  const u = new URL(url, location.href);
  if (!u.pathname.includes('/api/')) return realFetch(url, opts);
  await new Promise((r) => setTimeout(r, 90));
  const path = u.pathname.slice(u.pathname.indexOf('/api/'));

    });

  if (r.status === 401 && S.token && path !== '/api/login') { logout(); throw new Error(j.error || 'انتهت الجلسة، سجّل الدخول مرة أخرى'); }

}

  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }

  } catch (e) {
    if (!S.user) return;
    S.loading = false;
    if (!S.data) { S.error = e.message; render(); }
  }
}

function sheetShell(title, body) {
  return `<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${title}</h2><button class="x" data-act="close-sheet" aria-label="إغلاق">${ico('x')}</button></div>${body}</div>`;
}
function openSheet(s) { S.sheet = s; render(); setTimeout(() => { const f = $('.sheet [autofocus], .sheet input:not([type=hidden]), .sheet textarea'); if (f) f.focus(); }, 60); }
function closeSheet() { S.sheet = null; stopChat(); render(); }

const field = (id, label, inner, hint) => `<div class="field"><label for="${id}">${label}</label>${inner}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;

function renderSheet() {
  const root = $('#sheet-root');
  const s = S.sheet;
  if (!s) { root.hidden = true; root.innerHTML = ''; return; }
  root.hidden = false;
  const b = SHEETS[s.type];
  root.innerHTML = b ? sheetShell(...b(s)) : '';
}

    const st = S.data.settings;
    const body = `<form class="stack" data-form="new-order" novalidate>

      <div class="field"><span class="lbl">سعر التوصيل</span><div class="seg" id="o-zone"></div><span class="hint" id="o-zhint">منطقة متجرك: ${esc(S.user.area)}. يتحدد السعر تلقائياً حسب منطقة الزبون وتقدر تغيّره.</span></div>
      ${field('o-price', 'سعر المنتج (د.ع)', `<input class="in" id="o-price" name="productPrice" data-in="no" inputmode="numeric" placeholder="مثال: 30000" value="${esc(f.productPrice)}" required>`)}
      ${field('o-note', 'ملاحظة للسائق (اختياري)', `<textarea class="in" id="o-note" name="note" data-in="no" maxlength="200">${esc(f.note)}</textarea>`)}
      <div class="row between" style="border-top:1px dashed var(--line);padding-top:12px"><b>السعر الإجمالي</b><b id="o-total" style="font-size:20px"></b></div>

      <p class="hint" id="o-err" style="color:var(--red)" role="alert"></p>
      <button class="btn block" type="submit" id="o-btn">إرسال الطلب</button></form>`;

  note(s) {
    const o = S.data.available.find((x) => x.id === s.id);
    return [`ملاحظة طلب #${o ? o.no : ''}`, `<p>${o && o.note ? esc(o.note) : '<span class="muted">لا توجد ملاحظات من التاجر لهذا الطلب.</span>'}</p>`];
  },
  chat(s) {
    return [`محادثة طلب #${s.no}`, `<div class="chat" id="chat-box">${chatHtml(s.msgs)}</div><form class="row" data-form="chat"><input class="in grow" id="chat-in" name="text" maxlength="500" placeholder="اكتب رسالة…" autocomplete="off" aria-label="رسالة"><button class="btn" type="submit">إرسال</button></form>`];
  },
  charge() {
    return ['شحن رصيد المحفظة', `<form class="stack" data-form="charge"><p class="muted">لشحن الرصيد قم بإدخال رقم البطاقة</p>
      <div class="card-viz">${logo('dark')}<div class="no">1234 5678 9012</div><b>بطاقة شحن</b></div>
      ${field('c-num', 'رقم البطاقة', '<input class="in mono" id="c-num" name="number" data-in="card" inputmode="numeric" maxlength="14" placeholder="0000 0000 0000" autocomplete="off" required>', 'تحصل على رقم البطاقة من الإدارة أو وكيل ريو.')}
      <p class="hint" id="c-err" style="color:var(--red)" role="alert"></p>
      <button class="btn block" type="submit">شحن</button></form>`];
  },
  'edit-me'() {
    const me = S.user;
    return ['بياناتي', `<form class="stack" data-form="edit-me">
      ${field('m-name', 'الاسم', `<input class="in" id="m-name" name="name" value="${esc(me.name)}" required>`)}
      ${field('m-phone', 'رقم الهاتف', `<input class="in mono" id="m-phone" value="${esc(fmtPhone(me.phone))}" disabled>`, 'لتغيير رقم الهاتف تواصل مع الإدارة.')}
      ${me.role === 'driver' ? `<div class="field"><span class="lbl">المركبة</span><div class="seg"><button type="button" data-act="me-veh" data-v="bike" aria-pressed="${(S.sheet.vehicle || me.vehicle) === 'bike'}">${ico('bike')} دراجة</button><button type="button" data-act="me-veh" data-v="car" aria-pressed="${(S.sheet.vehicle || me.vehicle) === 'car'}">${ico('car')} سيارة</button></div></div>` : ''}
      <p class="hint" id="m-err" style="color:var(--red)" role="alert"></p><button class="btn block" type="submit">حفظ</button></form>`];
  },
  password() {
    return ['الأمان والخصوصية', `<form class="stack" data-form="password">
      ${field('p-cur', 'كلمة المرور الحالية', '<input class="in" id="p-cur" name="current" type="password" autocomplete="current-password" required>')}
      ${field('p-new', 'كلمة المرور الجديدة', '<input class="in" id="p-new" name="next" type="password" autocomplete="new-password" minlength="6" required>', '6 أحرف أو أكثر')}
      <p class="hint" id="p-err" style="color:var(--red)" role="alert"></p><button class="btn block" type="submit">تحديث كلمة المرور</button></form>`];
  },
  'delete-me'() {
    return ['حذف الحساب', `<form class="stack" data-form="delete-me"><div class="notice red">سيتم إلغاء حسابك نهائياً وحذف اسمك ورقمك. تبقى سجلات الطلبات المالية بدون هوية. لا يمكن التراجع.</div>
      ${field('d-pass', 'اكتب كلمة المرور للتأكيد', '<input class="in" id="d-pass" name="password" type="password" autocomplete="current-password" required>')}
      <p class="hint" id="d-err" style="color:var(--red)" role="alert"></p><button class="btn block danger arm" type="submit">حذف حسابي نهائياً</button></form>`];
  },
  'add-user'(s) {
    const d = s.role === 'driver';
    return [d ? 'إضافة سائق' : 'إضافة تاجر', `<form class="stack" data-form="add-user">
      ${field('u-name', d ? 'اسم السائق' : 'اسم المتجر', '<input class="in" id="u-name" name="name" required>')}
      ${field('u-phone', 'رقم الهاتف', '<input class="in mono" id="u-phone" name="phone" inputmode="tel" placeholder="07XX XXX XXXX" required>')}
      ${field('u-pass', 'كلمة المرور', '<input class="in" id="u-pass" name="password" minlength="6" required>', '6 أحرف أو أكثر. أعطها للمستخدم ليغيّرها بعد أول دخول.')}
      ${d ? `<div class="field"><span class="lbl">المركبة</span><div class="seg"><button type="button" data-act="nu-veh" data-v="bike" aria-pressed="${(s.vehicle || 'bike') === 'bike'}">${ico('bike')} دراجة</button><button type="button" data-act="nu-veh" data-v="car" aria-pressed="${s.vehicle === 'car'}">${ico('car')} سيارة</button></div></div>` : field('u-area', 'منطقة المتجر', '<input class="in" id="u-area" name="area" placeholder="مثال: الكرادة" required>', 'تُستخدم لتحديد سعر التوصيل (نفس المنطقة أو منطقة ثانية).')}
      <p class="hint" id="u-err" style="color:var(--red)" role="alert"></p><button class="btn block" type="submit">إنشاء الحساب</button></form>`];
  },
  'edit-user'(s) {
    const u = S.data.users.find((x) => x.id === s.id);
    if (!u) return ['تعديل', ''];
    return [`تعديل ${esc(u.name)}`, `<form class="stack" data-form="edit-user">
      ${field('e-name', 'الاسم', `<input class="in" id="e-name" name="name" value="${esc(u.name)}" required>`)}
      ${field('e-phone', 'رقم الهاتف', `<input class="in mono" id="e-phone" name="phone" value="${esc(u.phone)}" inputmode="tel" required>`)}
      ${u.role === 'merchant' ? field('e-area', 'المنطقة', `<input class="in" id="e-area" name="area" value="${esc(u.area)}" required>`) : `<div class="field"><span class="lbl">المركبة</span><div class="seg"><button type="button" data-act="eu-veh" data-v="bike" aria-pressed="${(s.vehicle || u.vehicle) === 'bike'}">${ico('bike')} دراجة</button><button type="button" data-act="eu-veh" data-v="car" aria-pressed="${(s.vehicle || u.vehicle) === 'car'}">${ico('car')} سيارة</button></div></div>`}
      ${field('e-pass', 'كلمة مرور جديدة (اتركها فارغة بدون تغيير)', '<input class="in" id="e-pass" name="password" minlength="6" autocomplete="off">')}
      <p class="hint" id="e-err" style="color:var(--red)" role="alert"></p><button class="btn block" type="submit">حفظ</button></form>`];
  },
  adjust(s) {
    const u = S.data.users.find((x) => x.id === s.id);
    if (!u) return ['الرصيد', ''];
    return [`رصيد ${esc(u.name)}`, `<form class="stack" data-form="adjust"><div class="balance"><div><small class="muted">الرصيد الحالي</small><strong style="font-size:30px">${money(u.balance)}</strong></div></div>
      ${field('a-amt', 'المبلغ (موجب للشحن، سالب للخصم)', '<input class="in mono" id="a-amt" name="amount" inputmode="numeric" placeholder="مثال: 10000 أو -5000" required>')}
      ${field('a-lbl', 'السبب (اختياري)', '<input class="in" id="a-lbl" name="label" maxlength="80" placeholder="شحن نقدي">')}
      <p class="hint" id="a-err" style="color:var(--red)" role="alert"></p><button class="btn block" type="submit">تنفيذ</button></form>`];
  }
};

/* ----- نموذج الطلب ----- */
function newOrderForm() { return { customerArea: '', customerPhone: '', product: '', qty: 1, vehicle: 'bike', zone: null, zoneManual: false, productPrice: '', note: '' }; }
function updateOrderForm() {
  const s = S.sheet;
  if (!s || s.type !== 'new-order' || !$('#o-zone')) return;
  const f = s.form;
  const st = S.data.settings;
  if (!f.zoneManual) f.zone = f.customerArea.trim() && normArea(f.customerArea) === normArea(S.user.area) ? 'same' : 'other';
  const p = (z) => st[f.vehicle + (z === 'same' ? 'Same' : 'Other')];
  $('#o-zone').innerHTML = ['same', 'other'].map((z) => `<button type="button" data-act="zone" data-z="${z}" aria-pressed="${f.zone === z}">${money(p(z))}<small>${z === 'same' ? 'نفس المنطقة' : 'منطقة ثانية'}</small></button>`).join('');
  const price = Number(digits(f.productPrice).replace(/[,\s]/g, '')) || 0;
  $('#o-total').innerHTML = money(price + p(f.zone));
  $('#o-qty').textContent = f.qty;
  document.querySelectorAll('#o-veh button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === f.vehicle)));
}

/* ----- المحادثة ----- */
const chatHtml = (msgs) => (msgs.length ? msgs.map((m) => `<div class="msg ${m.userId === S.user.id ? 'me' : ''}"><small>${esc(m.name)} · ${dt(m.at)}</small>${esc(m.text)}</div>`).join('') : '<p class="muted" style="text-align:center;margin:auto">لا توجد رسائل بعد. ابدأ المحادثة.</p>');
async function loadChat() {
  const s = S.sheet;
  if (!s || s.type !== 'chat') return;
  try {
    const r = await api('GET', `/api/orders/${s.id}/messages`);
    if (!S.sheet || S.sheet.type !== 'chat') return;
    if (JSON.stringify(r.messages) === JSON.stringify(s.msgs) && s.loaded) return;
    s.msgs = r.messages; s.loaded = true;
    const box = $('#chat-box');
    if (box) { box.innerHTML = chatHtml(s.msgs); box.scrollTop = box.scrollHeight; }
  } catch { /* ignore */ }
}
function startChat() { stopChat(); loadChat(); chatTimer = setInterval(loadChat, 5000); }
function stopChat() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

/* ============ الأحداث ============ */
const ACTIONS = {
  tab: (el) => go(el.dataset.tab),
  'tab-wallet': () => go('wallet'),
  logout: () => logout(),
  retry: () => refresh(true),
  filter: (el) => { S.filter = el.dataset.f; render(); },
  afilter: (el) => { S.adminFilter = el.dataset.f; S.data = null; lastSig = ''; render(); refresh(); },
  otab: (el) => { S.ordersTab = el.dataset.t; S.menu = null; render(); },
  wtab: (el) => { S.walletTab = el.dataset.t; render(); },
  'new-order': () => openSheet({ type: 'new-order', form: newOrderForm() }),
  note: (el) => openSheet({ type: 'note', id: Number(el.dataset.id) }),
  charge: () => openSheet({ type: 'charge' }),
  'edit-me': () => openSheet({ type: 'edit-me' }),
  password: () => openSheet({ type: 'password' }),
  'delete-me': () => openSheet({ type: 'delete-me' }),
  'close-sheet': () => closeSheet(),
  'add-user': (el) => openSheet({ type: 'add-user', role: el.dataset.role }),
  'edit-user': (el) => openSheet({ type: 'edit-user', id: Number(el.dataset.id) }),
  adjust: (el) => openSheet({ type: 'adjust', id: Number(el.dataset.id) }),
  menu: (el) => { const id = Number(el.dataset.id); S.menu = S.menu === id ? null : id; render(); },
  qty: (el) => { const f = S.sheet.form; f.qty = Math.min(99, Math.max(1, f.qty + Number(el.dataset.d))); updateOrderForm(); },
  veh: (el) => { S.sheet.form.vehicle = el.dataset.v; updateOrderForm(); },
  zone: (el) => { S.sheet.form.zone = el.dataset.z; S.sheet.form.zoneManual = true; updateOrderForm(); },
  'me-veh': (el) => { S.sheet.vehicle = el.dataset.v; syncVeh(el); },
  'nu-veh': (el) => { S.sheet.vehicle = el.dataset.v; syncVeh(el); },
  'eu-veh': (el) => { S.sheet.vehicle = el.dataset.v; syncVeh(el); },
  async chat(el) {
    const id = Number(el.dataset.id);
    const all = [...(S.data.orders || []), ...(S.data.attention || [])];
    const o = all.find((x) => x.id === id);
    openSheet({ type: 'chat', id, no: o ? o.no : id, msgs: [], loaded: false });
    startChat();
  },
  async cancel(el) {
    const id = el.dataset.id;
    if (S.armed !== 'c' + id) { S.armed = 'c' + id; render(); setTimeout(() => { if (S.armed === 'c' + id) { S.armed = null; render(); } }, 4000); return; }
    S.armed = null;
    if (await act(() => api('POST', `/api/merchant/orders/${id}/cancel`), 'تم إلغاء الطلب')) refresh(true);
  },
  async accept(el) {
    if (await act(() => api('POST', `/api/driver/orders/${el.dataset.id}/accept`), 'تم قبول الطلب. توجّه للتاجر لاستلامه')) { S.ordersTab = 'current'; go('orders'); } else refresh(true);
  },
  async 'set-status'(el) {
    S.menu = null;
    if (await act(() => api('POST', `/api/driver/orders/${el.dataset.id}/status`, { status: el.dataset.s }), 'تم تحديث الحالة')) refresh(true); else render();
  },
  async receiving() {
    const next = !S.data.me.receiving;
    if (await act(() => api('PUT', '/api/driver/receiving', { receiving: next }), next ? 'تم تفعيل استقبال الطلبات' : 'تم إيقاف استقبال الطلبات')) refresh(true);
  },
  async 'toggle-user'(el) {
    const u = S.data.users.find((x) => x.id === Number(el.dataset.id));
    if (u && await act(() => api('PUT', `/api/admin/users/${u.id}`, { active: !u.active }), u.active ? 'تم إيقاف الحساب' : 'تم تفعيل الحساب')) refresh(true);
  },
  async requeue(el) {
    if (S.armed !== 'r' + el.dataset.id) { S.armed = 'r' + el.dataset.id; el.textContent = 'اضغط للتأكيد'; setTimeout(() => { S.armed = null; if (el.isConnected) el.textContent = 'إعادة للسائقين'; }, 4000); return; }
    S.armed = null;
    if (await act(() => api('POST', `/api/admin/orders/${el.dataset.id}/requeue`), 'أُعيد الطلب للسائقين وأُرجعت الرسوم')) refresh(true);
  },
  async 'del-card'(el) {
    if (S.armed !== 'k' + el.dataset.n) { S.armed = 'k' + el.dataset.n; el.classList.add('arm'); setTimeout(() => { S.armed = null; el.classList.remove('arm'); }, 4000); return; }
    S.armed = null;
    if (await act(() => api('DELETE', `/api/admin/cards/${el.dataset.n}`), 'تم حذف الكرت')) refresh(true);
  },
  async copy(el) {
    const text = el.dataset.text;
    try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
    catch { toast('تعذّر النسخ تلقائياً، انسخ الرقم يدوياً', true); }
  }
};
function syncVeh(el) { el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !(el && el.dataset.act === 'menu') && !e.target.closest('.menu')) { S.menu = null; if (!el) render(); }
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { if (el.tagName === 'A') return; fn(el); }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.menu) { S.menu = null; render(); } } });

document.addEventListener('input', (e) => {
  const t = e.target;
  const k = t.dataset && t.dataset.in;
  if (k === 'no' && S.sheet && S.sheet.type === 'new-order') {
    const map = { customerArea: 'customerArea', customerPhone: 'customerPhone', product: 'product', productPrice: 'productPrice', note: 'note' };
    S.sheet.form[map[t.name]] = t.value;
    updateOrderForm();
  } else if (k === 'card') {
    const d = digits(t.value).replace(/\D/g, '').slice(0, 12);
    t.value = d.replace(/(\d{4})(?=\d)/g, '$1 ');
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.chg === 'admin-status') {
    if (await act(() => api('POST', `/api/admin/orders/${t.dataset.id}/status`, { status: t.value }), 'تم تغيير الحالة')) refresh(true); else refresh(true);
  }
});

const FORMS = {
  async login(f, err) {
    const r = await api('POST', '/api/login', { phone: f.phone.value, password: f.password.value });
    S.token = r.token; store.set('rio_token', r.token); setUser(r.user);
    go(S.tab && TABS[r.user.role].some((t) => t[0] === S.tab) ? S.tab : defaultTab());
    void err;
  },
  async 'new-order'(f) {
    const form = S.sheet.form;
    const body = { customerArea: form.customerArea, customerPhone: form.customerPhone, product: form.product, qty: form.qty, vehicle: form.vehicle, zone: form.zone, productPrice: form.productPrice, note: form.note };
    await api('POST', '/api/merchant/orders', body);
    toast('أُرسل الطلب للسائقين');
    closeSheet(); go('stats');
  },
  async charge(f) {
    const r = await api('POST', '/api/driver/charge', { number: f.number.value });
    toast(`تم شحن ${nf.format(r.amount)} د.ع`);
    closeSheet(); refresh(true);
  },
  async 'edit-me'(f) {
    const r = await api('PUT', '/api/me/profile', { name: f.name.value, vehicle: S.sheet.vehicle });
    setUser(r.user); toast('تم حفظ بياناتك'); closeSheet(); refresh(true);
  },
  async password(f) { await api('PUT', '/api/me/password', { current: f.current.value, next: f.next.value }); toast('تم تحديث كلمة المرور'); closeSheet(); },
  async 'delete-me'(f) { await api('POST', '/api/me/delete', { password: f.password.value }); toast('تم حذف حسابك'); closeSheet(); logout(); },
  async chat(f) {
    const text = f.text.value.trim();
    if (!text) return;
    f.text.value = '';
    await api('POST', `/api/orders/${S.sheet.id}/messages`, { text });
    S.sheet.loaded = false; await loadChat();
  },
  async 'add-user'(f) {
    await api('POST', '/api/admin/users', { role: S.sheet.role, name: f.name.value, phone: f.phone.value, password: f.password.value, area: f.area ? f.area.value : '', vehicle: S.sheet.vehicle || 'bike' });
    toast('تم إنشاء الحساب'); closeSheet(); refresh(true);
  },
  async 'edit-user'(f) {
    const body = { name: f.name.value, phone: f.phone.value };
    if (f.area) body.area = f.area.value; else body.vehicle = S.sheet.vehicle || S.data.users.find((x) => x.id === S.sheet.id).vehicle;
    if (f.password.value) body.password = f.password.value;
    await api('PUT', `/api/admin/users/${S.sheet.id}`, body);
    toast('تم الحفظ'); closeSheet(); refresh(true);
  },
  async adjust(f) {
    await api('POST', `/api/admin/users/${S.sheet.id}/adjust`, { amount: f.amount.value, label: f.label.value });
    toast('تم تعديل الرصيد'); closeSheet(); refresh(true);
  },
  async 'gen-cards'(f) {
    const r = await api('POST', '/api/admin/cards', { amount: f.amount.value, count: f.count.value });
    S.cardsBatch = r.made; toast(`تم توليد ${r.made.length} كرت`); refresh(true);
  },
  async settings(f) {
    const body = {};
    for (const k of ['bikeSame', 'bikeOther', 'carSame', 'carOther', 'feeSame', 'feeOther', 'support']) body[k] = f[k].value;
    await api('PUT', '/api/admin/settings', body);
    toast('تم حفظ الإعدادات'); refresh(true);
  }
};
const ERR_ID = { login: 'l-err', 'new-order': 'o-err', charge: 'c-err', 'edit-me': 'm-err', password: 'p-err', 'delete-me': 'd-err', 'add-user': 'u-err', 'edit-user': 'e-err', adjust: 'a-err' };

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const name = form.dataset.form;
  const fn = FORMS[name];
  if (!fn) return;
  const btn = form.querySelector('button[type=submit]');
  const errEl = ERR_ID[name] && $('#' + ERR_ID[name]);
  if (errEl) errEl.textContent = '';
  if (btn) btn.disabled = true;
  try { await fn(form.elements, errEl); }
  catch (er) { if (errEl) errEl.textContent = er.message; else toast(er.message, true); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ============ التشغيل ============ */
window.addEventListener('hashchange', () => {
  const t = location.hash.replace('#/', '');
  if (S.user && t && t !== S.tab && TABS[S.user.role].some((x) => x[0] === t)) go(t);
});

setInterval(() => {
  if (!S.user || S.sheet || S.menu || document.hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  refresh();
}, 10000);

async function boot() {
  const wanted = location.hash.replace('#/', '');
  if (S.token) {
    try {
      const r = await api('GET', '/api/me');
      setUser(r.user);
      const ok = TABS[r.user.role].some((t) => t[0] === wanted);
      go(ok ? wanted : defaultTab());
      return;
    } catch { /* يظهر تسجيل الدخول */ }
  }
  render();
}
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

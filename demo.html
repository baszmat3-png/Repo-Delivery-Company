<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ريو للتوصيل أسرع - نسخة تجريبية</title>
<meta name="theme-color" content="#0b1119">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>/* Layout: sticky topbar; side rail (>=900px) or bottom tabs (mobile); content column 760px, admin 1100px. */
/* ===== الثيمات: كل ثيم يغيّر المتغيرات فقط ===== */
:root{
  --font-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --bg-grad:none; --accent-bg:var(--accent); --bar:var(--bg);
}
/* أسود (الافتراضي في الوضع الداكن) */
:root,:root[data-theme="black"]{
  --bg:#050607; --surface:#111317; --surface-2:#1a1d23; --input:#0b0c0f; --line:#262a31;
  --fg:#f2f4f7; --muted:#9aa3ae; --accent:#ffd21f; --accent-ink:#171200; --accent-text:#ffd21f; --accent-soft:rgba(255,210,31,.14);
  --amber:#f0a93c; --green:#4cc884; --red:#f2766d; --blue:#7499f2;
  --amber-soft:rgba(240,169,60,.14); --green-soft:rgba(76,200,132,.14); --red-soft:rgba(242,118,109,.14); --blue-soft:rgba(116,153,242,.14);
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
/* أبيض */
:root[data-theme="white"]{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --input:#f2f5f8; --line:#dbe3ea;
  --fg:#111a24; --muted:#5b6c7e; --accent:#ffd21f; --accent-ink:#171200; --accent-text:#7d5f00; --accent-soft:rgba(255,210,31,.3);
  --amber:#a4660a; --green:#1d7f4a; --red:#c4372e; --blue:#2f55c4;
  --amber-soft:rgba(240,169,60,.2); --green-soft:rgba(76,200,132,.2); --red-soft:rgba(242,118,109,.2); --blue-soft:rgba(116,153,242,.2);
  --shadow:0 10px 30px rgba(17,26,36,.12); color-scheme:light;
}
/* أزرق متدرج */
:root[data-theme="ocean"]{
  --bg:#0a2a5e; --bg-grad:linear-gradient(165deg,#0a2a5e 0%,#0b4a8f 52%,#0f8fc4 100%); --bar:#0a2a5e;
  --surface:#0b2f5e; --surface-2:#12407a; --input:#082449; --line:#21568f;
  --fg:#f0f7ff; --muted:#a9c5e8; --accent:#5cc8ff; --accent-ink:#031a33; --accent-text:#9adcff; --accent-soft:rgba(92,200,255,.18);
  --accent-bg:linear-gradient(135deg,#9be4ff,#38b6ff);
  --amber:#ffc266; --green:#5fe0a0; --red:#ff8a80; --blue:#9bb8ff;
  --amber-soft:rgba(255,194,102,.16); --green-soft:rgba(95,224,160,.16); --red-soft:rgba(255,138,128,.16); --blue-soft:rgba(155,184,255,.16);
  --shadow:0 10px 30px rgba(0,10,40,.45); color-scheme:dark;
}
/* غروب متدرج */
:root[data-theme="sunset"]{
  --bg:#3a0f4d; --bg-grad:linear-gradient(165deg,#3a0f4d 0%,#8a1f5c 52%,#e8604c 100%); --bar:#3a0f4d;
  --surface:#4a1648; --surface-2:#5e1d56; --input:#34103d; --line:#823063;
  --fg:#fff4f0; --muted:#e8bccb; --accent:#ffb454; --accent-ink:#2b0a14; --accent-text:#ffcd8a; --accent-soft:rgba(255,180,84,.18);
  --accent-bg:linear-gradient(135deg,#ffd68a,#ff8a5c);
  --amber:#ffc266; --green:#6ee7a8; --red:#ff9a90; --blue:#b3c4ff;
  --amber-soft:rgba(255,194,102,.16); --green-soft:rgba(110,231,168,.16); --red-soft:rgba(255,154,144,.16); --blue-soft:rgba(179,196,255,.16);
  --shadow:0 10px 30px rgba(30,0,30,.45); color-scheme:dark;
}
/* أخضر متدرج */
:root[data-theme="forest"]{
  --bg:#052e1f; --bg-grad:linear-gradient(165deg,#052e1f 0%,#0a5c3d 52%,#1f9d6a 100%); --bar:#052e1f;
  --surface:#0a3a2a; --surface-2:#0f4a36; --input:#06281c; --line:#1e6c4d;
  --fg:#effff7; --muted:#a9d8c2; --accent:#b7f05a; --accent-ink:#0a2410; --accent-text:#cdf785; --accent-soft:rgba(183,240,90,.16);
  --accent-bg:linear-gradient(135deg,#d9f98a,#5be08a);
  --amber:#ffd36b; --green:#7df0b0; --red:#ff9a90; --blue:#a8c4ff;
  --amber-soft:rgba(255,211,107,.16); --green-soft:rgba(125,240,176,.16); --red-soft:rgba(255,154,144,.16); --blue-soft:rgba(168,196,255,.16);
  --shadow:0 10px 30px rgba(0,20,10,.45); color-scheme:dark;
}
html{background-color:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;background-repeat:no-repeat;min-height:100%}

*{box-sizing:border-box}
body{background:transparent;min-height:100vh;color:var(--fg);font:400 15px/1.65 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.04em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* logo */
.logo{display:inline-flex;align-items:center;gap:8px;direction:rtl;line-height:1}
.logo-lines{width:26px;height:20px;flex:none}
.logo-lines i{display:block;height:3.5px;border-radius:2px;background:var(--accent);margin-block:3px 0}
.logo-lines i:nth-child(1){width:26px}.logo-lines i:nth-child(2){width:19px}.logo-lines i:nth-child(3){width:23px}
.logo-word{font-family:var(--font-display);font-weight:900;font-size:30px;font-style:italic;display:block}
.logo-sub{font-size:9.5px;font-weight:600;letter-spacing:.02em;display:block;opacity:.75;margin-top:2px;text-align:center}
.logo-col{display:flex;flex-direction:column;transform:skewX(-6deg)}
.logo.big .logo-word{font-size:76px}.logo.big .logo-sub{font-size:19px}.logo.big .logo-lines{width:80px;height:62px}
.logo.big .logo-lines i{height:9px;margin-block:8px 0}
.logo.big .logo-lines i:nth-child(1){width:80px}.logo.big .logo-lines i:nth-child(2){width:58px}.logo.big .logo-lines i:nth-child(3){width:70px}
.logo.dark .logo-lines i{background:var(--accent-ink)}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;border-bottom:1px solid transparent;max-width:1180px;margin:0 auto}
.topbar{box-shadow:0 0 0 100vmax var(--bar);clip-path:inset(0 -100vmax)}
.topbar .grp{display:flex;align-items:center;gap:14px;min-width:0}
.rolechip{display:inline-flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:9px 14px;font-weight:600}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;padding:6px 2px}
.modepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.modepill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.modepill.live i{background:var(--green)}
.shell{max-width:1180px;margin:0 auto;display:block}
.shell.wide{max-width:1180px}
.main{min-width:0;padding-block:8px 120px}
.col{max-width:760px;margin:0 auto}
.col.wide{max-width:1100px}
.nav{position:fixed;inset:auto 0 0 0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:4px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;background:none;border:0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:500;color:var(--muted);position:relative}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:19px;height:19px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
  .nav{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));inset:auto;flex-direction:column;justify-content:flex-start;background:transparent;border:0;padding:8px 0}
  .nav button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:15px;justify-content:flex-start}
  .badge{position:static;margin-inline-start:auto}
  .main{padding-block:8px 60px}
}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:10px 16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:800}
.ph .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec{font-size:13px;color:var(--muted);font-weight:600;margin:20px 4px 8px}
.rule{height:1px;background:var(--line);border:0;margin:12px 0}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent-bg);color:var(--accent-ink);border:0;border-radius:14px;padding:11px 18px;font-weight:700;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:44;box-shadow:var(--shadow);border-radius:99px;padding:14px 22px}
@media (min-width:900px){.fab{bottom:28px}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:600}
.in{width:100%;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.in{min-height:78px;resize:vertical}
select.in{appearance:none;background-image:none;padding-inline-end:12px}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--input);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;background:none;border:0;border-radius:12px;padding:10px 8px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;line-height:1.3}
.seg button small{font-weight:500;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink)}
.seg.row-seg button{flex-direction:row}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--input);border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.toggle{width:56px;height:32px;border-radius:99px;border:2px solid var(--line);background:var(--input);position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .18s}
.toggle[aria-checked="true"]{background:var(--accent-bg);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{background:var(--accent-ink);transform:translateX(-24px)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:5px 12px;font-size:13.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
button.pill{cursor:pointer;min-height:36px}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:30;min-width:230px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:start;padding:11px 12px;border-radius:12px;font-size:15px}
.menu button:hover{background:var(--accent-soft)}
.menu .ck{width:18px;display:inline-grid;place-items:center;color:var(--accent-text)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:132px;color:inherit}
.tile .ring{width:62px;height:62px;border-radius:50%;border:4px solid var(--c,var(--accent));display:grid;place-items:center;font-size:20px;font-weight:700}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.tile b{font-weight:600;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px}
.kpi strong{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:2px}

/* order cards */
.ord{display:flex;flex-direction:column;gap:12px}
.ord-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ord-no{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}
.notice{background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:500}
.notice.red{background:var(--red-soft);color:var(--red)}
.phone{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-family:var(--font-mono)}
.avail{display:flex;gap:14px;align-items:stretch}
.avail .info{flex:1;min-width:0}
.avail .act{display:flex;flex-direction:column;gap:8px;width:128px;flex:none}
.avail h3{font-size:19px}
.price-line{font-weight:700;font-size:16px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:20px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.steps{display:flex;gap:4px;margin-top:2px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent-bg)}

/* wallet */
.balance{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.balance strong{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1.1;display:block}
.balance .ico{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.period{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.period>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.period small{color:var(--muted);font-size:13px;display:block}
.period b{font-family:var(--font-display);font-size:28px;display:block;line-height:1.2;margin-top:2px}
.period hr{border:0;height:1px;background:var(--line);margin:8px 0}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:14px;padding:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink)}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.neg{color:var(--red);font-weight:700}.pos{color:var(--green);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:22px}
.bars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .b{width:100%;max-width:44px;background:var(--accent-bg);border-radius:8px 8px 3px 3px;min-height:3px}
.bars span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bars em{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

/* profile */
.avatar{width:104px;height:104px;border-radius:50%;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:48px;font-weight:800;margin:6px auto 10px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.list-item .grow b{display:block;font-size:16px}
.list-item .grow small{color:var(--muted);font-size:13.5px}
.list-item .chev{color:var(--muted)}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* landing */
.land{max-width:1040px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;display:grid;gap:22px;position:relative;z-index:1}
.hero{background:var(--accent-bg);color:var(--accent-ink);border-radius:28px;padding:44px 20px;display:grid;place-items:center;overflow:hidden}
.hero .logo{transform:none}
.land h1{font-size:clamp(30px,5vw,44px);font-weight:900}
.land .lead{color:var(--muted);font-size:17px;margin-top:10px;max-width:46ch}
.roles{display:grid;gap:12px}
.role{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:start;width:100%;transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--accent)}
.role:disabled{opacity:.5;cursor:wait}
.role .ico{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.role .ico svg{width:28px;height:28px}
.role b{display:block;font-family:var(--font-display);font-size:21px}
.role small{color:var(--muted);font-size:14.5px}
@media (min-width:860px){.land{grid-template-columns:1.05fr 1fr;align-items:center;gap:36px;padding-block:48px}.hero{padding:70px 24px}.land .intro{grid-column:1/-1;text-align:center}.land .lead{margin-inline:auto}}
.land .fine{font-size:13px;color:var(--muted);text-align:center}

/* sheet / toast */
#sheet-root[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(3,8,14,.62);z-index:70}
.sheet{position:fixed;z-index:71;inset:auto 0 0 0;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(560px,94vw);border-radius:26px;animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.sheet-h h2{font-size:21px;font-weight:800}
.x{width:40px;height:40px;border-radius:50%;background:var(--input);border:1px solid var(--line);display:grid;place-items:center}
.card-viz{background:var(--accent-bg);color:var(--accent-ink);border-radius:22px;padding:20px;min-height:170px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.card-viz::before{content:"";position:absolute;inset:-30% auto -30% 8%;width:46px;background:rgba(23,18,0,.55);transform:rotate(22deg)}
.card-viz .no{font-family:var(--font-mono);font-weight:500;font-size:clamp(20px,6vw,28px);letter-spacing:.08em;direction:ltr;text-align:center;position:relative}
.card-viz .logo{position:relative}
.chat{display:flex;flex-direction:column;gap:8px;height:min(46dvh,380px);overflow:auto;padding:4px;margin-bottom:12px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--surface-2);align-self:flex-start;font-size:14.5px;overflow-wrap:anywhere}
.msg.me{background:var(--accent-bg);color:var(--accent-ink);align-self:flex-end}
.msg small{display:block;opacity:.7;font-size:11.5px;margin-bottom:1px}
#toast-root{position:fixed;z-index:90;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:var(--shadow);max-width:92vw;animation:up .2s ease-out}
.toast.err{background:var(--red);color:#fff}
@media (min-width:900px){#toast-root{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* تحسينات */
.phone{white-space:nowrap}
td{min-width:0}
.logo.big .logo-sub{margin-top:10px}
.logo-sub{margin-top:3px}

/* ===== وصل الطلب ===== */
a.btn{text-decoration:none}
.btn.wa{background:#25d366;color:#fff}
.rcpt-wrap{background:#eef1f5;border-radius:16px;padding:12px;max-height:60vh;overflow:auto}
.rcpt{background:#fff;color:#111;max-width:340px;margin:0 auto;padding:16px;text-align:right;border-radius:10px}
.rcpt .rl{display:block;width:170px;height:108px;max-width:100%;margin:0 auto 8px;flex:none}
.rcpt.sz58{max-width:210px;padding:10px;font-size:11px}.rcpt.sz58 .rl{width:110px;height:70px}.rcpt.sz58 h3{font-size:14px;margin-bottom:6px}.rcpt.sz58 .ttl{font-size:13px;padding:5px}.rcpt.sz58 .no{font-size:16px}.rcpt.sz58 .r{gap:6px;padding:4px 0}
.rcpt.sz58 .box{font-size:12px;padding:6px 8px}.rcpt.sz58 .box span{white-space:nowrap}
.rcpt.sz80{max-width:300px}
.rcpt.sza5{max-width:520px;font-size:15px}.rcpt.sza4{max-width:720px;font-size:17px;padding:24px}.rcpt.sza4 .rl{width:220px;height:140px}
.rcpt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rcpt h3{text-align:center;font-size:18px;margin:0 0 10px;font-weight:800}
.rcpt .ttl{border:2px solid #111;border-radius:12px;text-align:center;padding:8px;font-weight:800}
.rcpt .no{text-align:center;font-weight:800;font-size:20px;margin:8px 0 10px}
.rcpt .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.rcpt .r span{text-align:left}
.rcpt hr{border:0;border-top:1.5px dashed #999;margin:8px 0}
.rcpt .box{border:2px solid #111;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:8px 0}
#print-root{display:none}
@media print{
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  body.printing .rcpt{padding:0}
  body.printing .rcpt.sz58{max-width:54mm}body.printing .rcpt.sz80{max-width:76mm}body.printing .rcpt.sza5,body.printing .rcpt.sza4{max-width:100%}
  @page{margin:6mm}
}

/* ===== جرس الإشعارات + عنوان الوصل المختصر ===== */
.bell{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);border:0}
.bell .ic{width:22px;height:22px}
.bell .badge{position:absolute;top:-4px;inset-inline-start:auto;inset-inline-end:-4px;margin:0}
.bell .badge[hidden]{display:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--red);vertical-align:middle;margin-inline-start:6px}
.rcpt h3.rh{font-size:20px;margin:0 0 10px;color:#111}
@media (max-width:480px){
  .topbar{gap:6px}
  .topbar .grp{gap:6px}
  .topbar .link{white-space:nowrap;font-size:14px;padding:6px 0}
  .topbar .rolechip{padding:8px 10px;gap:6px;font-size:14px}
  .bell{width:38px;height:38px}
}

/* ===== شاشة الدخول الجديدة ===== */
.lg{width:100vw;margin-inline:calc(50% - 50vw);display:flex;flex-direction:column;min-height:100vh;background:#fff;color:#111}
.lg-hero img{display:block;width:100%;height:auto;max-height:46vh;object-fit:cover;object-position:top}
.lg-card{width:100%;max-width:520px;margin-inline:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:8px 22px 36px;text-align:center}
.lg-card h1{font-size:26px;font-weight:900;margin:0}
.lg-sub{margin:-6px 0 6px;font-size:14px;color:#333}
.lg-in{display:flex;align-items:center;gap:10px;background:#f3f4f6;border:1px solid #e1e4e8;border-radius:16px;padding:0 14px;min-height:52px}
.lg-in input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:16px;color:#111;min-width:0;text-align:right}
.lg-in .ic{width:22px;height:22px;flex:none;color:#111}
.lg-in .eye{background:none;border:0;padding:0;order:3;color:#555;cursor:pointer}
.lg-rem{display:flex;align-items:center;gap:8px;font-size:15px;color:#111;justify-self:start;cursor:pointer}
.lg-rem input{width:20px;height:20px}
.lg-or{display:flex;align-items:center;gap:12px;color:#555;font-size:13px}
.lg-or::before,.lg-or::after{content:"";flex:1;border-top:1px solid #ddd}
.lg-reg{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;min-height:56px;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.lg-reg .ic{width:24px;height:24px;stroke-width:2.2}
.lg-reg[data-role="merchant"]{background:#8a3a10;color:#fff}
.lg-reg[data-role="driver"]{background:#111;color:#ffd21f}
.lg-reg:active{transform:scale(.98)}
.lg-new{font-size:14px;color:#111;margin:4px 0 0}
.lg-link{background:none;border:0;padding:0;font:inherit;color:#1a6fe0;font-weight:700;text-decoration:underline;cursor:pointer}

/* ===== اختيار الثيم ===== */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-bottom:6px}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:13.5px;color:var(--fg)}
.theme-opt i{display:block;width:100%;height:48px;border-radius:10px;border:1px solid rgba(128,128,128,.35)}
.theme-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ===== بطاقة الطلب (تصميم موحّد للتاجر والسائق والمدير) ===== */
.oc{
  /* البطاقة فاتحة دائماً مثل التصميم المطلوب، لذا نثبّت ألوانها مهما كان الثيم */
  --fg:#1b1612; --muted:#7a6a58; --line:#eadfce; --surface:#ffffff; --surface-2:#faf6ee; --input:#f5f0e6;
  --amber:#a4660a; --green:#1d7f4a; --red:#c4372e; --blue:#2f55c4;
  --amber-soft:rgba(240,169,60,.2); --green-soft:rgba(76,200,132,.2); --red-soft:rgba(242,118,109,.2); --blue-soft:rgba(116,153,242,.2);
  --accent:#ffd21f; --accent-ink:#171200; --accent-text:#7d5f00; --accent-soft:rgba(255,210,31,.3); --accent-bg:#ffd21f;
  position:relative;background:#fff;color:var(--fg);border-radius:20px;padding:18px 28px 16px 18px;
  box-shadow:0 6px 26px rgba(255,193,7,.30),0 1px 3px rgba(0,0,0,.10);font-family:var(--font-display)
}
.oc::after{content:"";position:absolute;right:0;top:20%;bottom:20%;width:9px;border-radius:10px 0 0 10px;background:#ffc107}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.oc-no{font-weight:800;font-size:22px;color:#f5a31a;line-height:1.4}
.oc-no small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.oc-corner{display:flex;flex-direction:column;gap:8px;flex:none}
.oc-cb{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:112px;padding:7px 12px;border:0;border-radius:8px;color:#fff;font:800 15px var(--font-display);text-decoration:none;cursor:pointer}
.oc-cb.g{background:#34c759}.oc-cb.r{background:#ff3b47}
.oc-cb:disabled{opacity:.5}
.oc-cb .ic{width:22px;height:22px}
.oc-ex{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;color:#ff3b47;font-weight:900;font-size:15px;line-height:1}
.oc-r{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:14px;font-weight:700;font-size:15.5px}
.oc-r+.oc-r.sub{margin-top:10px}
.oc-i{width:34px;height:34px;flex:none;display:grid;place-items:center;color:#8a3a10}
.oc-i svg.ic{width:30px;height:30px;stroke-width:1.9}
.oc-d{width:30px;height:30px;border-radius:50%;background:#8a3a10;color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px;line-height:1}
.oc-l{color:#8a3a10;font-weight:800;white-space:nowrap}
.oc-v{color:#111;font-weight:800;min-width:0;overflow-wrap:anywhere}
.oc-plus{color:#8a3a10;font-size:26px;font-weight:300;line-height:1;margin-inline:2px}
.oc-chip{display:inline-block;background:#ddd8d9;color:#222;border-radius:12px;padding:5px 18px;font-weight:800}
.oc-sep{border:0;border-top:1.5px dashed #e6d7bd;margin:14px 0 0}
.oc .phone{color:#8a3a10}
.oc .pill{font-size:13.5px}
.oc .notice{margin-top:12px}
.oc-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.oc-act>*{flex:1 1 auto}
.oc .btn.ghost{background:#fff;color:#3b2a1a;border:1px solid #e2d3bb}
.oc .btn.danger{background:#fff;color:var(--red);border:1px solid #e2d3bb}
.oc .btn.danger.arm{background:var(--red);color:#fff}
.oc .btn.soft{background:#fff3c4;color:#6b5000}
.oc .btn.wa{background:#25d366;color:#fff}
.oc .menu{background:#fff;border-color:#e2d3bb;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.oc .menu button{color:#1b1612}

/* ===== صفحة الإشعارات الكاملة ===== */
.nt-list{display:flex;flex-direction:column;gap:10px}
.nt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;color:var(--fg)}
.nt.unread{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.nt-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.nt-ic.accent{background:var(--accent-soft);color:var(--accent-text)}
.nt-ic.green{background:var(--green-soft);color:var(--green)}
.nt-ic.red{background:var(--red-soft);color:var(--red)}
.nt-ic.amber{background:var(--amber-soft);color:var(--amber)}
.nt-ic.blue{background:var(--blue-soft);color:var(--blue)}
.nt-b{flex:1;min-width:0}
.nt-b b{display:block;font-size:15.5px;line-height:1.45}
.nt-b p{color:var(--muted);font-size:14px;white-space:pre-line;overflow-wrap:anywhere;margin-top:2px}
.nt-b small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.nt .dot{position:absolute;top:14px;inset-inline-end:14px;margin:0}
.nt-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.oc-grp{display:inline-flex;align-items:center;gap:6px 8px;flex-wrap:nowrap;white-space:nowrap}
.oc-no{white-space:nowrap;font-size:20px}
.oc-cb{min-width:104px;font-size:14.5px;padding:7px 10px}
.oc-r{font-size:15px}

/* ===== بطاقة الطلب: حجم وسط وأزرار داخل الحدود ===== */
.oc{box-sizing:border-box;max-width:100%;min-width:0;overflow:hidden;border-radius:18px;padding:14px 22px 13px 12px}
.oc::after{width:7px;top:24%;bottom:24%}
.oc-top{gap:8px;flex-wrap:nowrap;min-width:0}
.oc-top>:first-child{min-width:0;flex:1 1 auto}
.oc-corner{flex:0 0 auto;gap:6px;max-width:46%}
.oc-no{font-size:17px;line-height:1.35;white-space:nowrap}
.oc-no small{font-size:11.5px}
.oc-cb{min-width:0;width:100%;box-sizing:border-box;gap:6px;padding:5px 9px;font-size:13px;border-radius:8px;white-space:nowrap}
.oc-cb .ic,.oc-cb svg{width:17px;height:17px}
.oc-ex{width:18px;height:18px;font-size:12px}
.oc-r{font-size:13.5px;gap:3px 7px;margin-top:9px}
.oc-r+.oc-r.sub{margin-top:6px}
.oc-i{width:26px;height:26px}
.oc-i svg.ic,.oc .oc-i svg{width:22px;height:22px}
.oc-d{width:24px;height:24px;font-size:14px}
.oc-plus{font-size:20px}
.oc-chip{padding:3px 12px;border-radius:10px;font-size:13.5px}
.oc-sep{margin-top:10px}
.oc-act{gap:6px;margin-top:11px}
.oc-act .btn,.oc .btn.sm{font-size:12.5px;padding:6px 10px;min-height:34px}
.oc .pill{font-size:12.5px}
.oc .notice{margin-top:9px;font-size:12.5px}

/* ===== شريط طلب السماح بالإشعارات ===== */
.nbanner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--fg);border:1.5px solid var(--accent);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.nbanner:empty,#nbanner:empty{display:none}
.nbanner>.ic,.nbanner>svg{width:26px;height:26px;flex:none;color:var(--accent-text)}
.nbanner b{display:block;font-size:15.5px}
.nbanner small{display:block;color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.nbanner.warn{background:var(--amber-soft);border-color:var(--amber)}
.nbanner.warn>.ic,.nbanner.warn>svg{color:var(--amber)}
.nbanner .btn{flex:none}

/* ===== تصميم الوصولات: قسم الاختيار ===== */
.oc-c{font-style:normal}
.odp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:392px;margin:0 auto 6px}
.odp-o{display:flex;flex-direction:column;gap:2px;padding:6px 6px 10px;border-radius:18px;background:var(--surface);border:2px solid var(--line);color:var(--fg);cursor:pointer;text-align:center}
.odp-o b{font-size:14px;margin-top:6px}
.odp-o small{font-size:12px;color:var(--muted)}
.odp-o[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.odp-box{position:relative;height:178px;overflow:hidden;border-radius:12px;pointer-events:none;background:rgba(128,128,128,.12)}
.odp-in{position:absolute;top:6px;right:4px;width:360px;transform-origin:top right;transform:scale(.42)}
.odp-in .oc,.odp-in .od{margin:0}
@media (max-width:359px){.odp-in{transform:scale(.38)}}

/* ===== التصاميم البديلة لبطاقة الطلب (.od) ===== */
.od{
  --fg:#111;--muted:#7a6a58;--line:#eadfce;--surface:#fff;--surface-2:#faf6ee;--input:#fff;
  --amber:#a4660a;--green:#1d7f4a;--red:#c4372e;--blue:#2f55c4;
  --amber-soft:rgba(240,169,60,.2);--green-soft:rgba(76,200,132,.2);--red-soft:rgba(242,118,109,.2);--blue-soft:rgba(116,153,242,.2);
  --accent:#ffd21f;--accent-ink:#171200;--accent-text:#7d5f00;--accent-soft:rgba(255,210,31,.3);--accent-bg:#ffd21f;
  --od-bg:#fff;--od-lbl:#8a3a10;--od-r:20px;--od-box:#fff;--od-boxbd:2px solid #111;--od-det:#faf7ec;

.od *{box-sizing:border-box}
.od small{display:block}
.od-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.od-no{font-weight:900;font-size:28px;line-height:1.2;display:flex;flex-direction:column}
.od-nol{display:none;font-size:13px;font-weight:700;color:var(--od-lbl)}
.od-ago{font-size:13px;font-weight:600;white-space:nowrap}
.od-body{padding:16px 20px 20px}
.od-st{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;font-size:17px}
.od-sl{font-size:14px;font-weight:600}
.od[data-st="delivered"] .od-sv::before{content:"✓ "}
.od .od-sv .pill{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:900;font-size:inherit}
.od .od-sv select.in{min-width:140px;color:#111;background:#fff}
.od-store{display:flex;align-items:center;gap:12px}
.od-av{display:none;flex:none;place-items:center;font-weight:900}
.od-sn small{font-size:13px;font-weight:600;color:var(--od-lbl)}
.od-sn b{display:block;font-size:21px;font-weight:900;line-height:1.3}
.od-pr{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 10px;margin-top:14px}
.od-pl{flex:1 0 100%;font-size:13px;font-weight:600;color:var(--od-lbl)}
.od-pm{display:flex;align-items:baseline;gap:8px}
.od-pv{display:inline-flex;align-items:baseline;gap:8px}
.od-big{font-size:40px;font-weight:900;line-height:1.05;white-space:nowrap}
.od-pr em{font-style:normal;font-size:15px;font-weight:600;opacity:.75}
.od-dl{display:inline-block;white-space:nowrap;font-weight:800;font-size:13.5px;padding:5px 12px;border-radius:12px;border:2px solid #111}
.od-ad{display:flex;gap:10px;align-items:stretch;margin-top:14px}

.od-arrow{display:none}

.od-tg{display:block;width:100%;margin-top:14px;padding:15px;border:var(--od-tg);border-radius:var(--od-r);background:transparent;color:var(--od-tg-fg);font:900 17px var(--font-display);cursor:pointer}
.od-det{margin-top:14px;padding:4px 18px;border-radius:var(--od-r);background:var(--od-det)}
.od .oc-r{margin:0;padding:11px 0;gap:4px 10px;flex-wrap:nowrap;justify-content:space-between;align-items:center;font-size:14.5px;border-bottom:1.5px solid rgba(128,100,60,.16)}
.od .oc-r:last-child{border-bottom:0}
.od .oc-i,.od .oc-c{display:none}
.od .oc-l{color:var(--od-lbl);font-weight:600;font-size:14.5px}

.od .phone{color:var(--fg);font-family:var(--font-display);font-weight:800;font-size:15px}
.od-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.od-links>*{flex:1 1 38%;order:1}
.od .od-links .btn{min-height:52px;border-radius:var(--od-r);font:800 15px var(--font-display);padding:8px 12px}
.od .od-links .btn.soft{flex:1 1 100%;order:0;background:var(--od-waze);color:var(--od-waze-fg)}
.od .od-links .btn.wa{background:#25d366;color:#fff}

.od .oc-cb{flex:1 1 0;min-width:0;justify-content:center;gap:8px;min-height:56px;padding:8px 12px;border-radius:var(--od-r);font:900 18px var(--font-display);white-space:nowrap;width:auto}

.od .oc-cb svg{display:none}
.od .oc-cb[data-act="accept"] svg{display:inline-block;width:18px;height:18px;stroke-width:2.6}
.od .oc-ex{background:none;color:inherit;width:auto;height:auto;font-size:20px;font-weight:900}
.od .menu{background:#fff;color:#111;border:1px solid #ddd;box-shadow:0 10px 30px rgba(0,0,0,.25);inset-inline-start:auto;inset-inline-end:0}

/* --- 1) أسود وأصفر --- */
.od-bold{border:3px solid #111;border-radius:26px}
.od-bold .od-top{background:#111;color:#ffd21f;border-radius:23px 23px 0 0;padding:18px 22px 14px}
.od-bold .od-ago{color:#c9c3b0}
.od-bold .od-st{background:#ffd21f;color:#111;padding:14px 22px}
.od-bold .od-av{display:none}
.od-bold .od-sn b{font-size:24px}
.od-bold .od-pl{display:none}
.od-bold .od-pr{margin-top:18px}
.od-bold .od-pr::before{content:"سعر الطلب";flex:1 0 100%;font-size:13px;font-weight:600;color:var(--od-lbl)}
.od-bold .od-pv{background:linear-gradient(transparent 64%,#ffd21f 64%);padding-inline:2px}
.od-bold .od-big{font-size:42px}
.od-bold .od-ab{border-radius:20px}
.od-bold .od-body{padding-bottom:22px}

/* --- 2) أخضر متدرّج --- */
.od-green{--od-r:999px;--od-box:#f1f5f2;--od-boxbd:0 solid transparent;--od-det:#f6f8f6;--od-btn:#166b43;--od-btn-fg:#fff;--od-note-bd:1.5px solid #d6303f;--od-note:#d6303f;--od-waze:#fdf0bd;--od-waze-fg:#6b4d00;--od-sup-bd:1.5px solid #cfdcd7;--od-tg:1.5px solid #cfdcd7;--od-tg-fg:#166b43;border-radius:30px}
.od-green .od-top{background:linear-gradient(135deg,#0e3a29,#1f8a5b);color:#fff;border-radius:30px 30px 0 0;padding:20px 22px 22px}
.od-green .od-no{color:#c7f24a;font-size:26px}
.od-green .od-ago{color:#cfe7da}
.od-green .od-store{margin-top:12px}
.od-green .od-sn small{display:none}
.od-green .od-sn b{font-size:19px;font-weight:600}
.od-green .od-pl{display:none}
.od-green .od-pr{flex-direction:column;align-items:flex-start;margin-top:8px;gap:12px}
.od-green .od-pr em{color:#cfe7da}
.od-green .od-dl{background:#c7f24a;color:#13361f;border:0;border-radius:999px;font-size:15px}
.od-green .od-body{padding:18px 20px 22px}
.od-green .od-st{justify-content:flex-start;gap:6px;color:#166b43;font-size:16px}
.od-green .od-sl{order:-1;color:#8a3a10;font-size:16px;font-weight:700}
.od-green .od-sl::after{content:":"}
.od-green[data-st="delivered"] .od-sv::before{content:none}
.od-steps{display:flex;align-items:flex-start;margin:12px 0 4px}
.od-s{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:58px}
.od-s i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#e4eae6;color:#fff}
.od-s.on i{background:#22c55e}
.od-s i svg{width:24px;height:24px;stroke-width:3}
.od-s small{font-size:14px;font-weight:700;color:#8a9a90}
.od-s.on small{color:#166b43}
.od-ln{flex:1;height:5px;border-radius:5px;background:#e4eae6;margin-top:24px}
.od-ln.on{background:#22c55e}
.od-green .od-ab{padding:14px 16px;border-radius:18px}
.od-green .od-ad{margin-top:16px}

/* --- 3) تذكرة --- */
.od-ticket{--od-box:#f3f1ed;--od-boxbd:0 solid transparent;--od-det:#faf6ec;--od-r:22px;--od-btn:#1f9d4d;--od-btn-fg:#fff;--od-note:#d6303f;--od-note-bg:#fce9ea;--od-note-bd:0 solid transparent;--od-waze:#fcefc0;--od-waze-fg:#6b4d00;--od-sup-bd:2px solid #e5dcc6;--od-tg:2px dashed #d8cfb8;background:transparent;filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
.od-half{position:relative;isolation:isolate}
.od-half::before{content:"";position:absolute;inset:0;z-index:-1;background:#fff}
.od-ticket .od-top{padding:22px 22px 24px}
.od-ticket .od-top::before{border-radius:30px 30px 0 0;-webkit-mask:radial-gradient(circle 15px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 15px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.od-ticket .od-top::after{content:"";position:absolute;left:22px;right:22px;bottom:0;border-bottom:3px dashed #e6e0cf}
.od-ticket .od-bot{padding:20px 22px 22px}
.od-ticket .od-bot::before{border-radius:0 0 30px 30px;-webkit-mask:radial-gradient(circle 15px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 15px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.od-ticket .od-no{color:#d97706;font-size:34px}
.od-ticket .od-nol{display:block}
.od-ticket .od-ago{background:#f1ece0;color:#7a6f5c;padding:8px 18px;border-radius:999px;font-size:14px}
.od-ticket .od-st{margin-top:16px;padding:14px 18px;border-radius:18px;background:#e0f2e5;color:#1d7f4a}
.od-ticket .od-sl{color:#8a3a10}
.od-ticket .od-store{margin-top:18px}
.od-ticket .od-av{display:grid;width:90px;height:90px;border-radius:24px;background:#124a31;color:#a3e635;font-size:36px;flex:none}
.od-ticket .od-av{width:56px;height:56px;border-radius:16px;font-size:26px}
.od-ticket .od-pr{margin-top:0}
.od-ticket .od-big{font-size:42px}
.od-ticket .od-dl{background:#e8f5ec;color:#1d7f4a;border:0;border-radius:14px;font-size:15px}
.od-ticket .od-ad{align-items:center}
.od-ticket .od-ab{flex:0 0 auto;max-width:38%;border-radius:18px;padding:10px 16px}
.od-ticket .od-arrow{display:block;flex:1;height:0;border-top:4px dotted #d3c4a0;position:relative;min-width:20px}
.od-ticket .od-arrow::before{content:"";position:absolute;left:-4px;top:-9px;border:8px solid transparent;border-right:10px solid #d97706;border-left:0}
.od-ticket .oc-c{display:inline}
.od-ticket .oc-r{justify-content:flex-start;border-bottom:0;padding:8px 0;font-size:16px}
.od-ticket .oc-v{margin-inline-start:0}
.od-ticket .oc-l{font-weight:600}
.od-ticket .phone{color:#8a3a10}
.od-ticket .od-det{padding:12px 18px}
.od-ticket .od-main .oc-cb.g{background:#1f9d4d}

/* --- 4) أصفر وبني --- */
.od-sun{--od-bg:#fffaee;--od-box:#fff;--od-boxbd:2px solid #f0e5cf;--od-det:#fff3d6;--od-r:999px;--od-btn:#229e4e;--od-btn-fg:#fff;--od-note:#d6303f;--od-note-bg:transparent;--od-note-bd:2.5px solid #d6303f;--od-waze:#fdf0c0;--od-waze-fg:#6b4d00;--od-sup-bd:2px solid #ecdcb8;--od-tg:2px dashed #e2cf9f;border-radius:34px}
.od-sun .od-top{background:#fdbf26;color:#3f2a00;border-radius:34px 34px 0 0;padding:20px 26px}
.od-sun .od-no{font-size:30px;color:#3f2a00}
.od-sun .od-ago{color:#6b4d00;font-size:15px}
.od-sun .od-body{padding:20px 22px 24px}
.od-sun .od-st{background:#fdf0c0;color:#6b4d00;padding:12px 18px;border-radius:18px;margin-bottom:16px}
.od-sun .od-av{display:grid;width:54px;height:54px;border-radius:50%;background:#8a3a10;color:#fff;font-size:24px}
.od-sun .od-sn small{display:none}
.od-sun .od-sn b{font-size:22px}
.od-sun .od-pr{flex-wrap:nowrap;gap:12px;align-items:stretch;margin-top:16px}
.od-sun .od-pb,.od-sun .od-db{border-radius:26px;padding:14px 20px}
.od-sun .od-pb{flex:1.7 1 0;min-width:0;background:#8a3a10;color:#fff}
.od-sun .od-db{flex:1 1 0;min-width:0;background:#fdf0c0;color:#4a3500}
.od-sun .od-pb small{color:#f1d9c6}
.od-sun .od-db small{color:#6b4d00}
.od-sun .od-pb div,.od-sun .od-db div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.od-sun .od-pb .od-big{font-size:28px}
.od-sun .od-db b{font-size:22px;font-weight:900}
.od-sun .od-ab{border-radius:24px}
.od-sun .od-tg,.od-sun .od-det{border-radius:26px}
.od-sun .od-links .btn,.od-sun .oc-cb{border-radius:999px}

/* --- 5) داكن --- */
.od-night{--od-bg:#0a2a1d;--fg:#fff;--input:#0a2a1d;--line:#2f6b50;--od-lbl:#9bc0ad;--od-r:20px;--od-box:transparent;--od-boxbd:0 solid transparent;--od-det:#123d2b;--od-btn:#a3e635;--od-btn-fg:#0a2410;--od-note:#ff5d6c;--od-note-bg:transparent;--od-note-bd:2px solid #ff5d6c;--od-waze:rgba(163,230,53,.16);--od-waze-fg:#d7f78a;--od-sup-bd:2px solid #2f6b50;--od-tg:2px dashed #2f6b50;--od-tg-fg:#a3e635;--od-notice:rgba(163,230,53,.14);--od-notice-fg:#d7f78a;border:1px solid #17503a;border-radius:30px;padding:22px 22px 24px;color:#fff}
.od-night .od-body{padding:0}
.od-night .od-no{color:#a3e635;font-size:32px}
.od-night .od-ago{color:#8fb3a1}
.od-night .od-st{margin-top:14px;padding:10px 16px;border-radius:16px;background:rgba(163,230,53,.12);color:#a3e635}
.od-night .od-sl{color:#9bc0ad}
.od-night .od-store{margin-top:14px;gap:10px;color:#e6f5ec}
.od-night .od-av{display:block;width:14px;height:14px;border-radius:50%;background:#a3e635;font-size:0}
.od-night .od-sn small{display:none}
.od-night .od-sn b{font-size:19px;font-weight:600}
.od-night .od-pr{margin-top:16px;padding:18px 20px;border-radius:28px;background:#123d2b;align-items:center;flex-wrap:wrap}
.od-night .od-pm{flex-direction:column;align-items:flex-start;gap:0}
.od-night .od-pl{color:#9bc0ad;font-size:14px}
.od-night .od-big{font-size:44px}
.od-night .od-pr em{color:#9bc0ad;font-size:16px}
.od-night .od-dl{background:#27501f;border:1.5px solid #4c8a2c;color:#a3e635;border-radius:16px;text-align:center;font-size:14px;white-space:nowrap}
.od-night .od-ad{flex-direction:column;gap:18px;margin-top:20px;position:relative}
.od-night .od-ab{position:relative;padding:0 50px 0 0;background:none}
.od-night .od-ab::before{content:"";position:absolute;right:0;top:10px;width:24px;height:24px;border-radius:50%;border:3px solid #a3e635}
.od-night .od-ab+.od-arrow+.od-ab::before{background:#a3e635}
.od-night .od-ab:first-child::after{content:"";position:absolute;right:11px;top:38px;bottom:-22px;border-right:4px dotted #3b6e55}
.od-night .od-ab small{color:#9bc0ad}
.od-night .od-ab b{color:#fff;font-size:21px}
.od-night .oc-r{border-bottom-color:rgba(255,255,255,.1)}
.od-night .phone{color:#a3e635}
.od-night .od-links .btn.ghost{background:transparent;color:#fff}
.od-night .menu{background:#123d2b;color:#fff;border-color:#2f6b50}
.od-night .menu button{color:#fff}
.od-night .od-sv select.in{background:#0a2a1d;color:#fff;border-color:#2f6b50}

@media (max-width:380px){.od-big{font-size:38px}.od-night .od-big{font-size:42px}.od-ticket .od-big{font-size:40px}.od-no{font-size:24px}.od-sun .od-pb .od-big{font-size:28px}}

/* قائمة تغيير الحالة كانت تُقصّ داخل البطاقة فلا يظهر خيار «تم الإرجاع للتاجر»: نسمح لها بالخروج من البطاقة */

/* ===== قائمة الحالة داخل التصاميم الجديدة: تُفتح نحو داخل الشاشة ولا تخرج منها ===== */
.od .menu{inset-inline-start:auto;inset-inline-end:auto;right:0;left:auto;min-width:200px;max-width:calc(100vw - 40px);max-height:70vh;overflow:auto}

.od-green .od-no{font-size:22px}

<script>/* ريو — الثيمات (تُحمَّل في <head> لتجنّب الوميض). تُحفظ في الجهاز وتُشارَك بين التطبيق ولوحة التحكم. */
(function () {
  'use strict';
  var KEY = 'rio_theme';
  var LIST = [
    { id: 'white', name: 'أبيض', sw: 'linear-gradient(135deg,#ffffff,#e6ecf3)', meta: '#f2f5f8' },
    { id: 'black', name: 'أسود', sw: 'linear-gradient(135deg,#1b1e24,#000000)', meta: '#050607' },
    { id: 'ocean', name: 'أزرق', sw: 'linear-gradient(135deg,#0a2a5e,#0f8fc4)', meta: '#0a2a5e' },
    { id: 'sunset', name: 'غروب', sw: 'linear-gradient(135deg,#3a0f4d,#e8604c)', meta: '#3a0f4d' },
    { id: 'forest', name: 'أخضر', sw: 'linear-gradient(135deg,#052e1f,#1f9d6a)', meta: '#052e1f' }
  ];
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function valid(id) { return LIST.some(function (t) { return t.id === id; }); }
  function get() {
    var s = stored();
    if (valid(s)) return s;
    try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'white' : 'black'; } catch (e) { return 'black'; }
  }
  function apply(id) {
    if (!valid(id)) id = get();
    document.documentElement.setAttribute('data-theme', id);
    var t = LIST.filter(function (x) { return x.id === id; })[0];
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && t) m.setAttribute('content', t.meta);
  }
  function set(id) {
    if (!valid(id)) return;
    try { localStorage.setItem(KEY, id); } catch (e) { /* ignore */ }
    apply(id);
  }
  /* شبكة اختيار الثيم. attr = اسم السمة التي يلتقطها معالج النقر (data-act في التطبيق، data-a في اللوحة) */
  function picker(attr) {
    var cur = get();
    return '<div class="themes" role="group" aria-label="المظهر">' + LIST.map(function (t) {
      return '<button type="button" class="theme-opt" ' + attr + '="theme" data-t="' + t.id + '" aria-pressed="' + (cur === t.id) + '"><i style="background:' + t.sw + '"></i><span>' + t.name + '</span></button>';
    }).join('') + '</div>';
  }
  window.RioTheme = { list: LIST, get: get, set: set, apply: apply, picker: picker };
  apply(get());
})();

/* ============ التاجر ============ */
const countBy = (arr, list) => arr.filter((o) => list.includes(o.status)).length;

function tile(label, sub, n, color) {
  return `<div class="tile" style="--c:${color}"><span class="ring">${n}</span><div><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
}

/* ============ بطاقة الطلب الموحّدة (التاجر / السائق / المدير) ============ */
const dinar = (n) => `<span class="num">${nf.format(Math.round(n || 0))}</span> دينار`;
const OCI = { store: ico('store'), pin: ico('pin'), phone: ico('phone'), box: ico('orders'), cash: ico('wallet'), user: ico('user'), status: ico('orders') };
const ocRow = (i, l, v, cls = '') => `<div class="oc-r ${cls}"><span class="oc-i">${OCI[i]}</span><span class="oc-l">${l}<i class="oc-c">:</i></span><span class="oc-v">${v}</span></div>`;
const noteBtn = (o) => `<button class="oc-cb r" data-act="note" data-id="${o.id}"><span>ملاحظة</span><span class="oc-ex">!</span></button>`;
const chatBtn = (o) => `<button class="oc-cb g" data-act="chat" data-id="${o.id}"><span>محادثة</span>${ico('chat')}</button>`;
function wazeLinks(o) {
  const url = o.merchantMap || '';
  if (!url && !o.merchantArea) return '';
  const c = mapCoords(url);
  const wz = c ? `https://waze.com/ul?ll=${c[0]},${c[1]}&navigate=yes` : `https://waze.com/ul?q=${encodeURIComponent((o.merchantName || '') + ' ' + (o.merchantArea || ''))}&navigate=yes`;
  return `<a class="btn soft sm" href="${esc(wz)}" target="_blank" rel="noopener">${ico('pin')} Waze · موقع المتجر</a>${url ? `<a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener">الخريطة</a>` : ''}`;
}
/* opt: corner (أزرار الزاوية العلوية)، status (الحالة)، rows (تفاصيل إضافية)، after (تنبيهات)، actions (الأزرار السفلية) */
function orderCard(o, opt = {}) { return OCD === 'classic' ? ocClassic(o, opt) : odCard(o, opt, OCD); }
function ocClassic(o, opt = {}) {
  const corner = (opt.corner || '') + (opt.noteBtn ? noteBtn(o) : '');
  const rows = (opt.status ? ocRow('status', 'الحالة', opt.status) : '') + (opt.rows || '');
  return `<article class="oc">
    <div class="oc-top"><div class="oc-no">رقم الطلب : <bdi>#${o.no}</bdi><small>${ago(o.createdAt)}</small></div>${corner ? `<div class="oc-corner">${corner}</div>` : ''}</div>
    ${ocRow('store', 'اسم المتجر', esc(o.merchantName))}
    <div class="oc-r"><span class="oc-i"><span class="oc-d">$</span></span><span class="oc-l">سعر الطلب:</span><span class="oc-v">${dinar(o.productPrice)}</span><span class="oc-grp"><span class="oc-plus">+</span><span class="oc-l">التوصيل:</span><span class="oc-v">${dinar(o.deliveryPrice)}</span></span></div>
    ${ocRow('pin', 'عنوان المتجر', `<span class="oc-chip">${esc(o.merchantArea || '—')}</span>`)}
    ${ocRow('pin', 'عنوان الزبون', `<span class="oc-chip">${esc(o.customerArea)}</span>`)}
    ${rows ? `<hr class="oc-sep">${rows}` : ''}${opt.after || ''}
    ${opt.actions ? `<div class="oc-act">${opt.actions}</div>` : ''}
  </article>`;
}

/* ===== التصاميم البديلة لبطاقة الطلب (تصميم الوصولات) ===== */
const OD_STEPS = ['قبول', 'استلام', 'تسليم'];
const OD_DONE = { picking_up: 1, on_the_way: 2, delivered: 3, rejected: 2, no_answer: 2, postponed: 2, return_sent: 2, returned: 2, partial: 2 };
function odSteps(st) {
  const n = OD_DONE[st] || 0;
  return `<div class="od-steps">${OD_STEPS.map((t, i) => `${i ? `<span class="od-ln ${i < n ? 'on' : ''}"></span>` : ''}<span class="od-s ${i < n ? 'on' : ''}"><i>${i < n ? ico('check') : ''}</i><small>${t}</small></span>`).join('')}</div>`;
}
function odCard(o, opt = {}, d = 'bold') {
  const open = !!S.det[o.id];
  const hasDet = !!(opt.rows || opt.actions);
  const initial = esc((o.merchantName || '؟').trim().charAt(0));
  const main = (opt.corner || '') + (opt.noteBtn ? noteBtn(o) : '');
  const delivery = `<span class="od-dl">+ توصيل ${num(o.deliveryPrice)}</span>`;
  const head = `<div class="od-hd"><div class="od-no"><span class="od-nol">رقم الطلب</span><bdi>#${o.no}</bdi></div><span class="od-ago">${ago(o.createdAt)}</span></div>`;
  const stat = opt.status ? `<div class="od-st"><span class="od-sv">${opt.status}</span><span class="od-sl">الحالة</span></div>` : '';
  const store = `<div class="od-store"><span class="od-av">${initial}</span><span class="od-sn"><small>اسم المتجر</small><b>${esc(o.merchantName)}</b></span></div>`;
  const price = d === 'sun'
    ? `<div class="od-pr"><div class="od-pb"><small>سعر الطلب</small><div><b class="od-big">${num(o.productPrice)}</b> <em>دينار</em></div></div><div class="od-db"><small>التوصيل</small><div><b>${num(o.deliveryPrice)}</b> <em>دينار</em></div></div></div>`
    : d === 'night'
      ? `<div class="od-pr"><div class="od-pm"><small class="od-pl">سعر الطلب</small><b class="od-big">${num(o.productPrice)}</b><em>دينار</em></div>${delivery}</div>`
      : `<div class="od-pr"><small class="od-pl">سعر الطلب</small><div class="od-pm"><span class="od-pv"><b class="od-big">${num(o.productPrice)}</b><em>دينار</em></span></div>${d === 'green' ? '' : delivery}${d === 'green' ? delivery : ''}</div>`;
  const addr = `<div class="od-ad"><div class="od-ab"><small>عنوان المتجر</small><b>${esc(o.merchantArea || '—')}</b></div><span class="od-arrow" aria-hidden="true"></span><div class="od-ab"><small>عنوان الزبون</small><b>${esc(o.customerArea)}</b></div></div>`;
  const toggle = hasDet ? `<button type="button" class="od-tg" data-act="det" data-id="${o.id}" aria-expanded="${open}">${open ? '▴ إخفاء التفاصيل' : '▾ عرض التفاصيل'}</button>` : '';
  const det = hasDet && open ? `<div class="od-det">${opt.rows || ''}</div>${opt.actions ? `<div class="od-links">${opt.actions}</div>` : ''}` : '';
  const btns = main ? `<div class="od-main">${main}</div>` : '';
  const tail = `${opt.after || ''}${toggle}${det}${btns}`;
  let inner;
  if (d === 'green') inner = `<div class="od-top">${head}${store}${price}</div><div class="od-body">${opt.status ? stat + odSteps(o.status) : ''}${addr}${tail}</div>`;
  else if (d === 'ticket') inner = `<div class="od-half od-top">${head}${stat}${store}</div><div class="od-half od-bot">${price}${addr}${tail}</div>`;
  else if (d === 'sun') inner = `<div class="od-top">${head}</div><div class="od-body">${stat}${store}${price}${addr}${tail}</div>`;
  else if (d === 'night') inner = `<div class="od-body">${head}${stat}${store}${price}${addr}${tail}</div>`;
  else inner = `<div class="od-top">${head}</div>${stat}<div class="od-body">${store}${price}${addr}${tail}</div>`;
  return `<article class="od od-${d}" data-st="${esc(o.status || '')}">${inner}</article>`;
}
/* معاينة مصغّرة داخل قسم «تصميم الوصولات» (غير تفاعلية) */
function ocPreview(d) {
  const o = { id: 0, no: 1069, createdAt: Date.now() - 14 * 3600000, merchantName: 'متجر الرافدين', productPrice: 1000000, deliveryPrice: 5000, merchantArea: 'الكرادة', customerArea: 'حي اور', status: 'delivered' };
  const opt = { status: pill('delivered'), corner: chatBtn(o), noteBtn: true, rows: d === 'classic' ? '' : ocRow('phone', 'رقم الزبون', '0782 118 9947') };
  const prev = S.det[0]; S.det[0] = false;
  const html = (d === 'classic' ? ocClassic(o, opt) : odCard(o, opt, d)).replace(/\sdata-act="[^"]*"/g, '').replace(/\shref="[^"]*"/g, '');
  S.det[0] = prev;
  return html;
}

  <div class="odp" role="radiogroup" aria-label="تصميم الوصولات">${OC_DESIGNS.map(([k, n, sub]) => `<div class="odp-o" role="radio" tabindex="0" aria-checked="${OCD === k}" data-act="ocd" data-d="${k}"><div class="odp-box" aria-hidden="true"><div class="odp-in">${ocPreview(k)}</div></div><b>${n}</b><small>${sub}</small></div>`).join('')}</div>`;
}

function availOrderCard(o, s, receiving) {
  return orderCard(o, {
    corner: `<button class="oc-cb g" data-act="accept" data-id="${o.id}"><span>قبول الطلب</span>${ico('check')}</button><button class="oc-cb r" data-act="note" data-id="${o.id}"><span>ملاحظة</span><span class="oc-ex">!</span></button>`,

function driverOrderCard(o) {

  return orderCard(o, {

    after: o.status === 'picking_up' ? `<div class="notice">ادفع للتاجر ${money(o.productPrice)} عند الاستلام، وبعدها غيّر الحالة إلى «في الطريق للزبون».</div>` : '',
    actions: `${receiptsOn() ? `<button class="btn ghost sm" data-act="receipt" data-id="${o.id}">وصل</button>` : ''}<a class="btn wa sm" href="${waLink(o)}" target="_blank" rel="noopener">واتساب الزبون</a><a class="btn ghost sm" href="${supportLink(o)}" target="_blank" rel="noopener">واتساب الدعم</a>${wazeLinks(o)}`
  });
}

/* المدير داخل التطبيق: نفس البطاقة مع التحكم بالحالة */

/* ----- نموذج الطلب ----- */
function newOrderForm() { return { customerArea: '', customerPhone: '', product: '', qty: 1, vehicle: 'bike', zone: null, zoneManual: false, productPrice: '', note: '' }; }
function updateOrderForm() {
  const s = S.sheet;
  if (!s || s.type !== 'new-order' || !$('#o-zone')) return;
  const f = s.form;
  const st = S.data.settings;
  if (!f.zoneManual) f.zone = f.customerArea.trim() && normArea(f.customerArea) === normArea(S.user.area) ? 'same' : 'other';
  const p = (z) => st[f.vehicle + (z === 'same' ? 'Same' : 'Other')];
  $('#o-zone').innerHTML = ['same', 'other'].map((z) => `<button type="button" data-act="zone" data-z="${z}" aria-pressed="${f.zone === z}">${money(p(z))}<small>${z === 'same' ? 'نفس المنطقة' : 'منطقة ثانية'}</small></button>`).join('');
  const price = Number(digits(f.productPrice).replace(/[,\s]/g, '')) || 0;
  $('#o-total').innerHTML = money(price + p(f.zone));
  $('#o-qty').textContent = f.qty;
  document.querySelectorAll('#o-veh button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === f.vehicle)));
}

/* ----- المحادثة ----- */
const chatHtml = (msgs) => (msgs.length ? msgs.map((m) => `<div class="msg ${m.userId === S.user.id ? 'me' : ''}"><small>${esc(m.name)} · ${dt(m.at)}</small>${esc(m.text)}</div>`).join('') : '<p class="muted" style="text-align:center;margin:auto">لا توجد رسائل بعد. ابدأ المحادثة.</p>');
async function loadChat() {
  const s = S.sheet;
  if (!s || s.type !== 'chat') return;
  try {
    const r = await api('GET', `/api/orders/${s.id}/messages`);
    if (!S.sheet || S.sheet.type !== 'chat') return;
    if (JSON.stringify(r.messages) === JSON.stringify(s.msgs) && s.loaded) return;
    s.msgs = r.messages; s.loaded = true;
    const box = $('#chat-box');
    if (box) { box.innerHTML = chatHtml(s.msgs); box.scrollTop = box.scrollHeight; }
  } catch { /* ignore */ }
}
function startChat() { stopChat(); loadChat(); chatTimer = setInterval(loadChat, 5000); }
function stopChat() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

function syncVeh(el) { el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); }

document.addEventListener('click', (e) => {
  unlockAudio();
  if (S.user && S.user.role !== 'admin' && !clickAsked && !nOff() && notifState() === 'ask') { clickAsked = true; askNotifPermission(); }
  const el = e.target.closest('[data-act]');
  if (S.menu && !(el && el.dataset.act === 'menu') && !e.target.closest('.menu')) { S.menu = null; if (!el) render(); }
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { if (el.tagName === 'A') return; fn(el); }
});

document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.odp-o')) { e.preventDefault(); ACTIONS.ocd(e.target); return; } if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.menu) { S.menu = null; render(); } } });

document.addEventListener('input', (e) => {
  const t = e.target;
  const k = t.dataset && t.dataset.in;
  if (k === 'no' && S.sheet && S.sheet.type === 'new-order') {
    const map = { customerArea: 'customerArea', customerPhone: 'customerPhone', product: 'product', productPrice: 'productPrice', note: 'note' };
    S.sheet.form[map[t.name]] = t.value;
    updateOrderForm();
  } else if (k === 'card') {
    const d = digits(t.value).replace(/\D/g, '').slice(0, 12);
    t.value = d.replace(/(\d{4})(?=\d)/g, '$1 ');
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.chg === 'admin-status') {
    if (await act(() => api('POST', `/api/admin/orders/${t.dataset.id}/status`, { status: t.value }), 'تم تغيير الحالة')) refresh(true); else refresh(true);
  }
});

const FORMS = {
  async register(f) {
    const role = S.sheet.role;
    await api('POST', '/api/register', { role, name: f.name.value, phone: f.phone.value, password: f.password.value, area: f.area ? f.area.value : '', mapUrl: f.mapUrl ? f.mapUrl.value : '', vehicle: S.sheet.vehicle || 'bike' });
    closeSheet(); openSheet({ type: 'registered' });
  },
  async login(f, err) {
    const r = await api('POST', '/api/login', { phone: f.phone.value, password: f.password.value });
    if (r.user.role === 'staff') throw new Error('حساب الإدارة يدخل من لوحة التحكم (صفحة admin.html)');
    if (ADMIN_ONLY && r.user.role !== 'admin') throw new Error('هذه اللوحة للمدير فقط');
    S.token = r.token; if (f.remember && !f.remember.checked) { try { sessionStorage.setItem(TOKEN_KEY, r.token); } catch { /* ignore */ } store.del(TOKEN_KEY); } else store.set(TOKEN_KEY, r.token); setUser(r.user);
    go(S.tab && TABS[r.user.role].some((t) => t[0] === S.tab) ? S.tab : defaultTab());
    openPendingChat();
    void err;
  },
  async 'new-order'(f) {
    const form = S.sheet.form;
    const body = { customerArea: form.customerArea, customerPhone: form.customerPhone, product: form.product, qty: form.qty, vehicle: form.vehicle, zone: form.zone, productPrice: form.productPrice, note: form.note };
    await api('POST', '/api/merchant/orders', body);
    toast('أُرسل الطلب للسائقين');
    closeSheet(); go('stats');
  },
  async charge(f) {
    const r = await api('POST', '/api/driver/charge', { number: f.number.value });
    toast(`تم شحن ${nf.format(r.amount)} د.ع`);
    closeSheet(); refresh(true);
  },
  async 'edit-me'(f) {
    const r = await api('PUT', '/api/me/profile', { name: f.name.value });
    setUser(r.user); toast('تم حفظ بياناتك'); closeSheet(); refresh(true);
  },
  async password(f) { await api('PUT', '/api/me/password', { current: f.current.value, next: f.next.value }); toast('تم تحديث كلمة المرور'); closeSheet(); },
  async 'delete-me'(f) { await api('POST', '/api/me/delete', { password: f.password.value }); toast('تم حذف حسابك'); closeSheet(); logout(); },
  async chat(f) {
    const text = f.text.value.trim();
    if (!text) return;
    f.text.value = '';
    await api('POST', `/api/orders/${S.sheet.id}/messages`, { text });
    S.sheet.loaded = false; await loadChat();
  },
  async 'add-user'(f) {
    await api('POST', '/api/admin/users', { role: S.sheet.role, name: f.name.value, phone: f.phone.value, password: f.password.value, area: f.area ? f.area.value : '', mapUrl: f.mapUrl ? f.mapUrl.value : '', vehicle: S.sheet.vehicle || 'bike' });
    toast('تم إنشاء الحساب'); closeSheet(); refresh(true);
  },
  async 'edit-user'(f) {
    const body = { name: f.name.value, phone: f.phone.value };
    if (f.mapUrl) body.mapUrl = f.mapUrl.value;
    if (f.area) body.area = f.area.value; else body.vehicle = S.sheet.vehicle || S.data.users.find((x) => x.id === S.sheet.id).vehicle;
    if (f.password.value) body.password = f.password.value;
    await api('PUT', `/api/admin/users/${S.sheet.id}`, body);
    toast('تم الحفظ'); closeSheet(); refresh(true);
  },
  async adjust(f) {
    await api('POST', `/api/admin/users/${S.sheet.id}/adjust`, { amount: f.amount.value, label: f.label.value });
    toast('تم تعديل الرصيد'); closeSheet(); refresh(true);
  },
  async 'gen-cards'(f) {
    const r = await api('POST', '/api/admin/cards', { amount: f.amount.value, count: f.count.value });
    S.cardsBatch = r.made; toast(`تم توليد ${r.made.length} كرت`); refresh(true);
  },
  async settings(f) {
    const body = {};
    for (const k of ['bikeSame', 'bikeOther', 'carSame', 'carOther', 'feeSame', 'feeOther', 'support']) body[k] = f[k].value;
    body.receipts = f.receipts.checked;
    await api('PUT', '/api/admin/settings', body);
    toast('تم حفظ الإعدادات'); refresh(true);
  }
};
const ERR_ID = { login: 'l-err', 'new-order': 'o-err', charge: 'c-err', 'edit-me': 'm-err', password: 'p-err', 'delete-me': 'd-err', 'add-user': 'u-err', 'edit-user': 'e-err', adjust: 'a-err', register: 'r-err' };

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const name = form.dataset.form;
  const fn = FORMS[name];
  if (!fn) return;
  const btn = form.querySelector('button[type=submit]');
  const errEl = ERR_ID[name] && $('#' + ERR_ID[name]);
  if (errEl) errEl.textContent = '';
  if (btn) btn.disabled = true;
  try { await fn(form.elements, errEl); }
  catch (er) { if (errEl) errEl.textContent = er.message; else toast(er.message, true); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ============ التشغيل ============ */
window.addEventListener('hashchange', () => {
  const t = location.hash.replace('#/', '');
  if (S.user && t && t !== S.tab && (t === 'notifs' && S.user.role !== 'admin' || TABS[S.user.role].some((x) => x[0] === t))) go(t);
});

setInterval(() => {
  if (!S.user || S.sheet || S.menu || document.hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  refresh();
}, 10000);

async function boot() {
  const wanted = location.hash.replace('#/', '');
  if (S.token) {
    try {
      const r = await api('GET', '/api/me');
      if (r.user.role === 'staff' || (ADMIN_ONLY && r.user.role !== 'admin')) throw new Error('not admin');
      setUser(r.user);
      const ok = TABS[r.user.role].some((t) => t[0] === wanted) || (wanted === 'notifs' && r.user.role !== 'admin');
      go(ok ? wanted : defaultTab());
      openPendingChat();
      return;
    } catch { /* يظهر تسجيل الدخول */ }
  }
  render();
}
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

# Render Blueprint: يُنشئ الخادم وقاعدة البيانات معاً
services:
  - type: web
    name: rio-delivery
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: rio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "0"

databases:
  - name: rio-db
    plan: free
